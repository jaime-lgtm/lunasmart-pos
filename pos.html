<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Luna Smart POS &mdash; Sueno de Luna</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#1c120a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon.svg">
<style>
/* ============================================================
   LUNA SMART POS -- estilos (flujo inspirado en Parrot)
   ============================================================ */
:root{
  --cafe:#1c120a; --cafe-medio:#3d2010; --terracota:#b14618;
  --terracota-claro:#d0632f; --beige:#e8d6b9; --beige-claro:#f5ecdd;
  --verde-ok:#3f7d4e; --rojo:#c0392b; --gris:#8a7d6b; --linea:#e4dccb;
  --azul:#2f6f9e;
  --sombra:0 4px 18px rgba(28,18,10,.14);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
html,body{height:100%;height:100dvh;}
body{background:#faf6ef;color:var(--cafe);overflow:hidden;user-select:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select,textarea{font-family:inherit;font-size:16px;}
.hidden{display:none !important;}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--cafe);color:var(--beige);padding:14px 22px;border-radius:12px;font-size:15px;box-shadow:var(--sombra);opacity:0;pointer-events:none;transition:.25s;z-index:9999;max-width:90vw;text-align:center;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.screen{height:100vh;height:100dvh;display:none;flex-direction:column;}
.screen.active{display:flex;}

/* ============ LOGIN PIN ============ */
#scLogin{background:linear-gradient(160deg,var(--cafe),var(--cafe-medio));align-items:center;justify-content:center;color:var(--beige);}
.login-box{width:100%;max-width:360px;text-align:center;padding:20px;}
.login-brand{font-size:30px;font-weight:800;letter-spacing:.5px;}
.login-brand span{color:var(--terracota-claro);}
.login-hi{font-size:20px;margin-top:22px;font-weight:600;}
.login-hint{font-size:14px;opacity:.8;margin-top:6px;line-height:1.4;}
.pin-display{margin:22px auto 10px;height:54px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid rgba(232,214,185,.25);display:flex;align-items:center;justify-content:center;gap:14px;}
.pin-dot{width:14px;height:14px;border-radius:50%;background:rgba(232,214,185,.3);}
.pin-dot.on{background:var(--terracota-claro);}
.login-suc select{width:100%;padding:12px;border-radius:12px;border:1px solid rgba(232,214,185,.3);background:rgba(255,255,255,.07);color:var(--beige);}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:6px;}
.key{height:64px;border-radius:14px;background:rgba(255,255,255,.08);font-size:24px;font-weight:700;color:var(--beige);display:flex;align-items:center;justify-content:center;transition:.12s;}
.key:active{background:var(--terracota);}
.key.enter{background:var(--terracota);}

/* ============ TOPBAR ============ */
.topbar{background:#fff;border-bottom:1px solid var(--linea);padding:0 14px;display:flex;align-items:center;gap:2px;flex-shrink:0;height:56px;}
.topbar .brand{font-weight:800;font-size:16px;color:var(--cafe);margin-right:8px;}
.topbar .brand span{color:var(--terracota);}
.nav-tab{padding:18px 12px;font-weight:600;font-size:15px;color:var(--gris);border-bottom:3px solid transparent;white-space:nowrap;}
.nav-tab.active{color:var(--terracota);border-bottom-color:var(--terracota);}
.nav-tab .badge{background:var(--terracota);color:#fff;border-radius:10px;font-size:12px;padding:1px 7px;margin-left:5px;}
.topbar .spacer{flex:1;}
.topbar .suc-pill{background:var(--beige-claro);color:var(--cafe-medio);padding:6px 12px;border-radius:20px;font-size:13px;font-weight:600;}
.topbar .logout{color:var(--gris);font-size:14px;padding:8px 10px;}

/* ============ TIPO DE ORDEN ============ */
#scTipoOrden .to-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;}
.to-title{font-size:24px;font-weight:700;color:var(--cafe-medio);}
.to-row{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;}
.to-card{width:200px;height:170px;border:1px solid var(--linea);border-radius:16px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-size:17px;font-weight:600;box-shadow:var(--sombra);transition:.12s;}
.to-card:active{transform:scale(.97);border-color:var(--terracota);}
.to-ic{font-size:42px;}

/* ============ POS ============ */
.pos-wrap{flex:1;display:flex;overflow:hidden;}
.pos-left{flex:1.7;display:flex;flex-direction:column;padding:14px;overflow:hidden;}
.pos-topline{display:flex;gap:12px;align-items:center;margin-bottom:12px;}
.pos-search{flex:1;padding:12px 16px;border:1px solid var(--linea);border-radius:12px;background:#fff;}
.lbl{font-size:12px;font-weight:700;color:var(--gris);letter-spacing:.5px;margin:4px 2px 8px;text-transform:uppercase;}
.chip-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;}
.chip{padding:11px 20px;border-radius:12px;background:#fff;border:1px solid var(--linea);font-weight:600;font-size:14px;color:var(--cafe-medio);white-space:nowrap;flex-shrink:0;}
.chip.active{background:var(--cafe-medio);color:var(--beige);border-color:var(--cafe-medio);}
.chip.sub.active{background:var(--terracota);border-color:var(--terracota);color:#fff;}
.prod-grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;align-content:start;padding-bottom:20px;}
.prod-btn{background:#fff;border:1px solid var(--linea);border-radius:14px;padding:16px 14px;min-height:96px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;transition:.12s;box-shadow:0 2px 6px rgba(28,18,10,.04);}
.prod-btn:active{transform:scale(.96);border-color:var(--terracota);}
.prod-btn .pn{font-weight:700;font-size:15px;line-height:1.25;}
.prod-btn .pp{font-weight:800;font-size:16px;color:var(--terracota);margin-top:10px;}

/* Carrito */
.pos-right{flex:1;max-width:390px;background:#fff;border-left:1px solid var(--linea);display:flex;flex-direction:column;}
.cart-head{padding:14px 16px;border-bottom:1px solid var(--linea);display:flex;justify-content:space-between;align-items:flex-start;}
.cart-head .t{font-weight:800;font-size:18px;}
.cart-head .st{font-size:13px;color:var(--gris);margin-top:2px;}
.cart-head .clear{font-size:13px;color:var(--rojo);font-weight:600;}
.cart-lines{flex:1;overflow-y:auto;padding:6px 14px;}
.cart-empty{color:var(--gris);text-align:center;padding:40px 20px;font-size:15px;}
.cart-line{display:flex;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px solid var(--beige-claro);}
.cart-line .info{flex:1;}
.cart-line .info .n{font-weight:600;font-size:14px;}
.cart-line .info .u{font-size:12px;color:var(--gris);}
.cart-line .info .note{font-size:12px;color:var(--azul);font-style:italic;margin-top:2px;}
.qty{display:flex;align-items:center;gap:8px;}
.qty button{width:32px;height:32px;border-radius:9px;background:var(--beige-claro);font-size:19px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.qty button:active{background:var(--terracota);color:#fff;}
.qty .q{min-width:20px;text-align:center;font-weight:700;}
.cart-line .sub{font-weight:700;min-width:60px;text-align:right;font-size:14px;}
/* barra de acciones Nota/Descuento/Separador */
.cart-actions{display:flex;gap:6px;padding:10px 14px;border-top:1px solid var(--linea);}
.cart-act{flex:1;padding:11px 4px;border-radius:10px;background:var(--beige-claro);font-weight:700;font-size:13px;color:var(--cafe-medio);display:flex;align-items:center;justify-content:center;gap:5px;}
.cart-act:active{background:var(--terracota);color:#fff;}
.cart-foot{border-top:1px solid var(--linea);padding:14px 16px;}
.row-line{display:flex;justify-content:space-between;font-size:14px;color:var(--gris);margin-bottom:6px;}
.row-line.desc{color:var(--rojo);}
.cart-total{display:flex;justify-content:space-between;font-size:22px;font-weight:800;margin:8px 0 14px;}
.cart-total .amt{color:var(--terracota);}
.btn-cobrar{width:100%;padding:17px;border-radius:13px;background:var(--terracota);color:#fff;font-size:18px;font-weight:800;box-shadow:var(--sombra);}
.btn-cobrar:disabled{background:var(--gris);opacity:.5;box-shadow:none;}

/* ============ MODAL generico ============ */
.modal-bg{position:fixed;inset:0;background:rgba(28,18,10,.55);z-index:500;display:flex;align-items:center;justify-content:center;padding:16px;}
.modal{background:#fff;border-radius:20px;box-shadow:var(--sombra);width:100%;max-width:460px;padding:24px;max-height:92vh;overflow-y:auto;}
.modal h2{font-size:20px;margin-bottom:4px;}
.modal-total{font-size:30px;font-weight:800;color:var(--terracota);margin-bottom:18px;}
.modal .field{margin-bottom:14px;}
.modal .field label{display:block;font-size:13px;font-weight:700;color:var(--cafe-medio);margin-bottom:6px;}
.modal .field input,.modal .field textarea,.modal .field select{width:100%;padding:13px;border:1px solid var(--linea);border-radius:12px;background:var(--beige-claro);}
.modal .field textarea{min-height:80px;resize:vertical;}
.seg{display:flex;gap:8px;margin-bottom:14px;}
.seg button{flex:1;padding:12px;border-radius:10px;border:1px solid var(--linea);background:#fff;font-weight:700;font-size:14px;}
.seg button.active{background:var(--cafe-medio);color:var(--beige);border-color:var(--cafe-medio);}
.pay-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.pay-btn{padding:16px 8px;border-radius:12px;border:1px solid var(--linea);background:#fff;font-weight:700;font-size:14px;color:var(--cafe-medio);}
.pay-btn.active{background:var(--cafe-medio);color:var(--beige);border-color:var(--cafe-medio);}
.cash-box input{width:100%;padding:15px;border:1px solid var(--linea);border-radius:12px;font-size:20px;font-weight:700;text-align:right;background:var(--beige-claro);}
.quick-cash{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.quick-cash button{flex:1;padding:10px;border-radius:10px;background:var(--beige-claro);font-weight:700;font-size:14px;min-width:64px;}
.change-row{display:flex;justify-content:space-between;font-size:18px;font-weight:700;margin:12px 0;}
.change-row .change{color:var(--verde-ok);}
.change-row .change.neg{color:var(--rojo);}
.modal-actions{display:flex;gap:10px;}
.btn-cancel{flex:1;padding:15px;border-radius:12px;background:var(--beige-claro);color:var(--cafe-medio);font-weight:700;}
.btn-confirm{flex:2;padding:15px;border-radius:12px;background:var(--verde-ok);color:#fff;font-weight:800;font-size:16px;}
.btn-confirm:disabled{opacity:.4;}

/* ============ PANELES (Mesas, Pedidos, Config, Caja) ============ */
.panel{flex:1;overflow-y:auto;padding:22px;width:100%;max-width:1000px;margin:0 auto;}
.panel h2{font-size:24px;margin-bottom:4px;}
.panel .sub{color:var(--gris);margin-bottom:20px;}
.card{background:#fff;border:1px solid var(--linea);border-radius:14px;padding:18px;box-shadow:var(--sombra);margin-bottom:16px;}
.card h3{font-size:16px;color:var(--cafe-medio);margin-bottom:12px;border-bottom:1px solid var(--linea);padding-bottom:8px;}
/* Mesas */
.mesa-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:14px;}
.mesa{border-radius:14px;padding:18px 12px;text-align:center;font-weight:700;border:2px solid;box-shadow:var(--sombra);transition:.12s;}
.mesa:active{transform:scale(.96);}
.mesa.libre{background:#eef6ef;border-color:var(--verde-ok);color:var(--verde-ok);}
.mesa.ocupada{background:#fbeeea;border-color:var(--terracota);color:var(--terracota);}
.mesa .mn{font-size:20px;}
.mesa .ms{font-size:12px;font-weight:600;margin-top:6px;}
.mesa .mt{font-size:13px;font-weight:800;margin-top:4px;}
/* Pedidos historial */
.ped-row{display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid var(--beige-claro);}
.ped-row .pid{font-weight:800;color:var(--terracota);min-width:70px;}
.ped-row .pinfo{flex:1;}
.ped-row .pinfo .pt{font-weight:600;}
.ped-row .pinfo .pm{font-size:13px;color:var(--gris);}
.ped-row .ptot{font-weight:800;}
.ped-row .pest{font-size:12px;padding:3px 10px;border-radius:12px;font-weight:700;}
.pest.pagado{background:#eef6ef;color:var(--verde-ok);}
.pest.abierto{background:#fdf3e7;color:var(--terracota);}
.pest.cancelado{background:#fbeeea;color:var(--rojo);}
/* Config */
.cfg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;}
.cfg-card{background:#fff;border:1px solid var(--linea);border-radius:16px;padding:26px 16px;text-align:center;box-shadow:var(--sombra);transition:.12s;}
.cfg-card:active{transform:scale(.97);border-color:var(--terracota);}
.cfg-ic{font-size:38px;}
.cfg-t{font-weight:700;margin-top:12px;}
.cfg-badge{font-size:11px;padding:2px 8px;border-radius:10px;margin-top:8px;display:inline-block;font-weight:700;}
.cfg-badge.ok{background:#eef6ef;color:var(--verde-ok);}
.cfg-badge.err{background:#fbeeea;color:var(--rojo);}
/* Caja */
.pay-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.pay-summary .pill{background:var(--beige-claro);border-radius:12px;padding:14px;text-align:center;}
.pay-summary .pill .l{font-size:12px;color:var(--gris);}
.pay-summary .pill .v{font-size:18px;font-weight:800;}
.caja-info{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:8px;}
.caja-info div .l{font-size:12px;color:var(--gris);}
.caja-info div .v{font-size:18px;font-weight:800;}
.caja-ops{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;}
.caja-op{padding:16px;border-radius:12px;background:var(--beige-claro);font-weight:700;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;}
.caja-op:active{background:var(--terracota);color:#fff;}
.caja-op .ci{font-size:26px;}
.star-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--beige-claro);}
.grand{display:flex;justify-content:space-between;font-size:22px;font-weight:800;margin-top:10px;}
.grand .amt{color:var(--terracota);}
.caja-actions{display:flex;gap:12px;margin-top:4px;}
.btn-print{flex:1;padding:16px;border-radius:13px;background:var(--cafe-medio);color:var(--beige);font-weight:700;}
.btn-cerrar{flex:1;padding:16px;border-radius:13px;background:var(--terracota);color:#fff;font-weight:800;}

@media(max-width:860px){
  .pos-wrap{flex-direction:column;}
  .pos-left{flex:none;padding:12px;overflow:visible;}
  .pos-right{max-width:none;border-left:none;border-top:2px solid var(--linea);max-height:48vh;flex:none;}
  .prod-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));}
  .pay-summary{grid-template-columns:1fr 1fr;}
  .to-card{width:150px;height:150px;}
  .panel{padding:16px;}
  .cfg-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;}
  .kds-grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));}
}
@media(max-width:600px){
  .topbar{flex-wrap:nowrap;overflow-x:auto;height:auto;padding:6px 8px;gap:0;-webkit-overflow-scrolling:touch;}
  .topbar::-webkit-scrollbar{display:none;}
  .brand{font-size:14px;margin-right:4px;flex-shrink:0;}
  .nav-tab{padding:12px 10px;font-size:14px;flex-shrink:0;}
  .spacer{display:none;}
  .suc-pill{font-size:11px;padding:5px 9px;flex-shrink:0;}
  #tbUser{display:none;}
  .logout{flex-shrink:0;font-size:13px;}
  .pos-left{padding:8px;}
  .prod-grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;}
  .pos-right{max-height:52vh;}
  .pay-summary{grid-template-columns:1fr;}
  .to-card{width:44vw;max-width:200px;height:130px;}
  .scTipoOrden,#scTipoOrden{flex-direction:column;}
  .panel{padding:12px;}
  h2{font-size:1.2rem;}
  .cfg-grid{grid-template-columns:1fr 1fr;gap:10px;}
  .mesa-grid{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;}
  .kds-grid{grid-template-columns:1fr;}
  .cart-actions{flex-wrap:wrap;}
  .keypad{gap:10px;}
  .key{height:58px;font-size:22px;}
  .modal{width:94vw;max-width:none;padding:16px;}
  .det-list{max-height:44vh;}
}
@media print{ body *{visibility:hidden;} #printArea,#printArea *{visibility:visible;} #printArea{position:absolute;left:0;top:0;width:100%;padding:20px;} }

.det-list{margin:10px 0;max-height:320px;overflow:auto}.det-row{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid rgba(0,0,0,.08)}.det-q{font-weight:700;color:var(--terracota);min-width:34px}.det-n{flex:1}.det-note{font-size:.8rem;color:#8a7a68;font-style:italic;margin-top:2px}.det-p{font-weight:600;white-space:nowrap}.det-tot{display:flex;justify-content:space-between;padding:5px 0;font-size:.95rem}.det-grand{font-weight:800;font-size:1.15rem;border-top:2px solid var(--cafe-medio);margin-top:6px;padding-top:10px}
/* ===== KDS / Monitor de estacion ===== */.kds-filter{display:flex;gap:8px;margin:10px 0 16px;flex-wrap:wrap}.kds-f{padding:9px 18px;border-radius:20px;background:var(--beige-claro);color:var(--cafe-medio);font-weight:600;font-size:14px;border:1px solid var(--linea)}.kds-f.on{background:var(--terracota);color:#fff;border-color:var(--terracota)}.kds-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}.kds-card{background:#fff;border:1px solid var(--linea);border-radius:14px;padding:14px;border-top:5px solid var(--gris)}.kds-card.barra{border-top-color:#2f6f9e}.kds-card.cocina{border-top-color:var(--terracota)}.kdc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}.kdc-folio{font-weight:800;font-size:1.15rem;color:var(--cafe)}.kdc-area{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:3px 9px;border-radius:10px;background:var(--beige-claro);color:var(--cafe-medio)}.kdc-meta{font-size:.82rem;color:var(--gris);margin-bottom:10px}.kdc-item{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid rgba(0,0,0,.06);justify-content:space-between;align-items:center}.kdc-item-info{display:flex;gap:8px;flex:1;min-width:0}.kdc-item-listo{opacity:.5}.kdc-item-listo .kdc-n{text-decoration:line-through}.kdc-check{color:var(--verde-ok);font-weight:800;font-size:18px}.kdc-item-btn{padding:6px 14px;border-radius:8px;background:var(--verde-ok);color:#fff;font-weight:700;font-size:12.5px;white-space:nowrap}.kdc-q{font-weight:800;color:var(--terracota);min-width:30px}.kdc-n{flex:1;font-weight:600}.kdc-note{font-size:.78rem;color:#8a7a68;font-style:italic;font-weight:400}.kdc-btn{margin-top:12px;width:100%;padding:12px;border-radius:10px;background:var(--verde-ok);color:#fff;font-weight:700;font-size:15px}.kdc-timer{font-size:.8rem;font-weight:800;padding:3px 9px;border-radius:10px;background:#eef6ef;color:var(--verde-ok);}.kdc-timer.tw-amarillo{background:#fdf3e0;color:#a8730f;}.kdc-timer.tw-rojo{background:#fbeeea;color:var(--rojo);}
/* --- descripcion en tiles --- */
.prod-btn{ display:flex; flex-direction:column; align-items:flex-start; gap:2px; }
.prod-btn .pd{ font-size:11px; color:#7a6650; line-height:1.2; margin:2px 0; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.prod-btn .pmods{ font-size:10px; color:var(--terracota); font-weight:600; }
.cart-line .cmods{ font-size:11px; color:var(--terracota); margin-top:2px; }
.kdc-mods{ font-size:12px; color:#b14618; font-weight:600; margin-top:2px; }
/* --- modal de modificadores --- */
.mods-backdrop{ position:fixed; inset:0; background:rgba(28,18,10,.55); display:none; align-items:flex-end; justify-content:center; z-index:9000; }
.mods-backdrop.show{ display:flex; }

<script>
/* ============================================================
   LUNA SMART POS -- Logica (CASCARA, flujo estilo Parrot)
   Datos MOCK. Los === API === son ganchos al Apps Script.
   ============================================================ */
var CONFIG = { API_URL:'', SHEET_ID:'1Dm5fcTs_URmtv8cwUDV6z_LxuGvdpJmf0ZkxszXzuCk', IVA_RATE:0.08 };

/* ==== FIREBASE: pedidos en vivo (Monitor de estación en tiempo real) ==== */
var firebaseConfig = {
  apiKey: "AIzaSyAylUrEQGXad-DAZrTCWVrrXeq1rrLVTwM",
  authDomain: "luna-smart-pos.firebaseapp.com",
  databaseURL: "https://luna-smart-pos-default-rtdb.firebaseio.com",
  projectId: "luna-smart-pos",
  storageBucket: "luna-smart-pos.firebasestorage.app",
  messagingSenderId: "29167679041",
  appId: "1:29167679041:web:0959c2161d86552ded38c0"
};
firebase.initializeApp(firebaseConfig);
var fbDb = firebase.database();
var fbAuthReady = firebase.auth().signInAnonymously().catch(function(e){ console.error('Firebase auth', e); });
var fbPedidosListener = null, fbListenerSuc = null;

function fbPedidosRef(suc){ return fbDb.ref('pedidos/'+suc); }

function fbEscucharPedidos(suc){
  fbDejarDeEscucharPedidos();
  fbListenerSuc = suc;
  var _conocidos=null;
  fbPedidosListener = function(snap){
    var val = snap.val() || {};
    var arr = Object.keys(val).map(function(k){ var p=val[k]; p._fbKey=k; return p; });
    arr.sort(function(a,b){ return (b._ts||0)-(a._ts||0); });
    if(_conocidos){
      var hayNuevo=arr.some(function(p){ return !_conocidos[p._fbKey]; });
      if(hayNuevo) playAlertSound();
    }
    _conocidos={}; arr.forEach(function(p){ _conocidos[p._fbKey]=true; });
    state.pedidos = arr;
    renderTopbar();
    if(state.view==='kds') renderKds();
    if(state.view==='pedidos') renderPedidos();
  };
  fbAuthReady.then(function(){ fbPedidosRef(suc).on('value', fbPedidosListener); });
}
function fbDejarDeEscucharPedidos(){
  if(fbPedidosListener && fbListenerSuc){ fbPedidosRef(fbListenerSuc).off('value', fbPedidosListener); }
  fbPedidosListener = null; fbListenerSuc = null;
}
function fbActualizarEstadoPedido(suc, fbKey, campo, valor){
  var upd={}; upd[campo]=valor;
  fbPedidosRef(suc).child(fbKey).update(upd).catch(function(e){ showToast('Sin conexión con el monitor -- reintenta'); console.error(e); });
}
function fbLimpiarPedidos(suc){
  return fbPedidosRef(suc).remove().catch(function(e){ console.error(e); });
}

/* ==== FIREBASE: ventas del turno en vivo (sobreviven refresh/logout hasta el corte) ==== */
var fbTurnoSalesListener=null, fbTurnoSalesListenerSuc=null;
function fbTurnoSalesRef(suc){ return fbDb.ref('turnoSales/'+suc); }
function fbEscucharTurnoSales(suc){
  fbDejarDeEscucharTurnoSales();
  fbTurnoSalesListenerSuc=suc;
  fbTurnoSalesListener=function(snap){
    var val=snap.val()||{};
    var arr=Object.keys(val).map(function(k){ var v=val[k]; v._fbKey=k; return v; });
    arr.sort(function(a,b){ return (a.ts||0)-(b.ts||0); });
    state.turnoSales = arr;
    if(state.view==='caja') renderCaja();
  };
  fbAuthReady.then(function(){ fbTurnoSalesRef(suc).on('value', fbTurnoSalesListener); });
}
function fbDejarDeEscucharTurnoSales(){
  if(fbTurnoSalesListener && fbTurnoSalesListenerSuc){ fbTurnoSalesRef(fbTurnoSalesListenerSuc).off('value', fbTurnoSalesListener); }
  fbTurnoSalesListener=null; fbTurnoSalesListenerSuc=null;
}
function fbAgregarVenta(suc,venta){
  return fbTurnoSalesRef(suc).push().set(venta).catch(function(e){ showToast('Sin conexión -- la venta no se sincronizó'); console.error(e); });
}
function fbQuitarVenta(suc,fbKey){
  if(!fbKey) return Promise.resolve();
  return fbTurnoSalesRef(suc).child(fbKey).remove().catch(function(e){ console.error(e); });
}
function fbLimpiarTurnoSales(suc){
  return fbTurnoSalesRef(suc).remove().catch(function(e){ console.error(e); });
}

/* ==== FIREBASE: Cliente unico (Puntos de Lealtad + domicilio), global por telefono ====
   clientesLealtad/$telefono es el UNICO registro de cliente -- lo usan tanto el
   flujo de "Cliente" (puntos) como el de "Datos de entrega" (domicilio), para que
   un mismo telefono jale siempre el mismo cliente sin importar por donde se capture. */
var PUNTOS_TASA=0.02; // 2% del total pagado se acumula como puntos (1 punto = $1)
function _normTelLealtad(tel){ return String(tel||'').replace(/\D/g,''); }
function fbLealtadRef(tel){ return fbDb.ref('clientesLealtad/'+_normTelLealtad(tel)); }
function fbBuscarLealtad(tel){
  var t=_normTelLealtad(tel); if(t.length!==10) return Promise.resolve(null);
  return fbAuthReady.then(function(){ return fbLealtadRef(t).once('value'); }).then(function(snap){ return snap.val(); });
}
function etiquetaCliente(visitas){
  visitas=visitas||0;
  if(visitas>=5) return 'CLIENTE FRECUENTE';
  if(visitas>=2) return 'CLIENTE REGULAR';
  return 'CLIENTE NUEVO';
}
// Guarda/actualiza un cliente sin pisar puntos/visitas si ya existia (upsert).
// Tambien espeja el registro a la hoja CLIENTES_DOMICILIO en Sheets (si hay sync configurada).
function fbGuardarCliente(tel,datos){
  var t=_normTelLealtad(tel); if(t.length!==10) return Promise.resolve(null);
  return fbAuthReady.then(function(){
    var ref=fbLealtadRef(t);
    return ref.once('value').then(function(snap){
      var existe=snap.val();
      var payload={telefono:t};
      // El nombre queda "fijo" una vez guardado -- no se sobrescribe con lo que
      // alguien mas escriba despues con el mismo telefono (evita que un error de
      // ortografia o un pedido a nombre de otra persona en la familia borre el
      // nombre correcto ya guardado). La direccion SI se actualiza en cada pedido
      // -- un cliente puede pedir un dia a su casa y otro a su trabajo.
      if(datos.nombre && !(existe&&existe.nombre)) payload.nombre=datos.nombre;
      if(datos.direccion) payload.direccion=datos.direccion;
      if(datos.referencia) payload.referencia=datos.referencia;
      if(datos.cumpleanos && !(existe&&existe.cumpleanos)) payload.cumpleanos=datos.cumpleanos;
      if(!existe){ payload.puntos=0; payload.visitas=0; payload.creado=firebase.database.ServerValue.TIMESTAMP; }
      return ref.update(payload).then(function(){ return {existe:!!existe, cliente:Object.assign({},existe,payload)}; });
    });
  }).then(function(r){
    if(SYNC.configurado()){
      SYNC.registrarClienteDom({telefono:t,nombre:r.cliente.nombre||'',direccion:r.cliente.direccion||'',referencia:r.cliente.referencia||'',cumpleanos:r.cliente.cumpleanos||'',puntos:r.cliente.puntos||0,etiqueta:etiquetaCliente(r.cliente.visitas),sucursal:state.sucursal}).catch(function(){});
    }
    return r.cliente;
  }).catch(function(e){ console.error('guardar cliente',e); return null; });
}
// Busca primero en Firebase (fuente en vivo); si no existe ahi, revisa la hoja
// CLIENTES_DOMICILIO por si ya es cliente de domicilio pero aun no de Puntos de Lealtad.
// Combina Firebase (fuente en vivo de puntos) con la hoja CLIENTES_DOMICILIO:
// un registro de lealtad puede no tener direccion (se creo desde "Cliente",
// que no la pide), asi que si falta se completa con lo que haya en la hoja.
function fbBuscarClienteUnificado(tel){
  return fbBuscarLealtad(tel).then(function(cli){
    if(cli && cli.direccion) return {origen:'lealtad', cliente:cli};
    if(!SYNC.configurado()) return cli ? {origen:'lealtad', cliente:cli} : null;
    return SYNC.buscarClienteDom(tel).then(function(res){
      var dom=(res && res.ok && res.cliente) ? res.cliente : null;
      if(cli && dom) return {origen:'lealtad', cliente:Object.assign({},dom,cli,{direccion:cli.direccion||dom.direccion,referencia:cli.referencia||dom.referencia})};
      if(cli) return {origen:'lealtad', cliente:cli};
      if(dom) return {origen:'domicilio', cliente:dom};
      return null;
    }).catch(function(){ return cli ? {origen:'lealtad', cliente:cli} : null; });
  });
}
// Registra la venta (canje + acumulacion) y suma una visita, todo en una sola
// transaccion sobre el nodo completo del cliente para evitar que dos escrituras
// concurrentes del mismo telefono se pisen entre si.
function fbRegistrarVentaLealtad(tel,gastar,ganar){
  var t=_normTelLealtad(tel); gastar=Math.max(0,Math.round(gastar||0)); ganar=Math.max(0,Math.round(ganar||0));
  if(t.length!==10||(!gastar&&!ganar)) return Promise.resolve(true);
  return fbAuthReady.then(function(){
    var ref=fbLealtadRef(t);
    return ref.once('value').then(function(snap){
      if(((snap.val()||{}).puntos||0)<gastar) return {committed:false};
      return ref.transaction(function(actual){
        actual=actual||{telefono:t};
        actual.puntos=Math.max(0,(actual.puntos||0)-gastar+ganar);
        actual.visitas=(actual.visitas||0)+1;
        actual.ultimaVisita=Date.now();
        return actual;
      });
    });
  }).then(function(res){ return !!res.committed; }).catch(function(e){ console.error('registrar venta lealtad',e); return false; });
}

/* ==== FIREBASE: catalogo de productos en vivo (antes hardcodeado en el codigo) ==== */
var fbCatalogoListener=null, fbCatalogoListenerSuc=null;
function fbEscucharCatalogo(suc){
  fbDejarDeEscucharCatalogo();
  fbCatalogoListenerSuc=suc;
  // Fallback local: mientras responde Firebase (o si no responde, p.ej. sin
  // internet), usar el ultimo catalogo bueno guardado en este dispositivo en
  // vez de dejar el POS sin productos.
  try{
    var cache=localStorage.getItem('ls_catalogo_'+suc);
    if(cache) CATALOG[suc]=JSON.parse(cache);
  }catch(e){}
  fbCatalogoListener=function(snap){
    var val=snap.val();
    // Si Firebase todavia no tiene nada para esta sucursal, conservar lo que
    // ya haya en CATALOG (el fallback de localStorage, o lo que sea) en vez
    // de vaciarlo -- solo se reemplaza cuando de verdad llega un catalogo.
    if(!val || !Object.keys(val).length){ if(state.view==='pos') renderPos(); return; }
    CATALOG[suc]=Object.keys(val).map(function(k){ return val[k]; });
    try{ localStorage.setItem('ls_catalogo_'+suc, JSON.stringify(CATALOG[suc])); }catch(e){}
    if(state.view==='pos') renderPos();
  };
  fbAuthReady.then(function(){ fbDb.ref('catalogo/'+suc).on('value', fbCatalogoListener); });
}
function fbDejarDeEscucharCatalogo(){
  if(fbCatalogoListenerSuc && fbCatalogoListener){ fbDb.ref('catalogo/'+fbCatalogoListenerSuc).off('value', fbCatalogoListener); }
  fbCatalogoListener=null; fbCatalogoListenerSuc=null;
}

/* ==== RECETAS: cache de ingredientes por receta, para descontar inventario al vender ==== */
var RECETAS_CACHE={detallesPorReceta:{}};
function cargarRecetasCache(){
  try{
    var cache=localStorage.getItem('ls_recetas_det');
    if(cache) RECETAS_CACHE.detallesPorReceta=JSON.parse(cache);
  }catch(e){}
  var url=SYNC.getUrl();
  fetch(url+'?accion=getBD_RECETAS_DETALLES&_='+Date.now()).then(function(r){return r.json();}).then(function(res){
    if(!res||res.status!=='ok'||!res.data) return;
    var rows=res.data.slice(1); // fila 0 = encabezados
    var det={};
    rows.forEach(function(row){
      var idReceta=String(row[0]||'').trim(); if(!idReceta) return;
      var art=String(row[1]||'').trim(); var cant=parseFloat(row[2])||0;
      if(!art||!cant) return;
      (det[idReceta]=det[idReceta]||[]).push({articulo:art, cantidad:cant});
    });
    RECETAS_CACHE.detallesPorReceta=det;
    try{ localStorage.setItem('ls_recetas_det', JSON.stringify(det)); }catch(e){}
  }).catch(function(e){ console.error('cargarRecetasCache', e); });
}

   inventario (agrega/sustituye) siempre vive en el producto -- p.modInv --

// Ordena una lista de nombres: primero segun el orden guardado desde el
// admin, y lo que no este ahi (categorias nuevas) al final, alfabetico.
function _ordenarConGuardado(nombres, ordenGuardado){
  var guardado=ordenGuardado||[];
  var enGuardado=guardado.filter(function(n){return nombres.indexOf(n)>-1;});
  var resto=nombres.filter(function(n){return guardado.indexOf(n)<0;}).sort(function(a,b){return String(a).localeCompare(String(b),'es');});
  return enGuardado.concat(resto);
}
function _resolverModsProducto(p){
  var lib=MODIFICADORES_CACHE[state.sucursal]||{};
  var TIPO_A_UI={unico:'single', multiple:'multi', cantidad:'distribuir'};
  var deLaBiblioteca=(p.modAsignados||[]).map(function(modId){
    var m=lib[modId]; if(!m) return null;
    var tipo=TIPO_A_UI[m.tipo]||'single';
    var grupo={label:m.nombre, type:tipo, req:!!m.obligatorio,
      opts:(m.opciones||[]).map(function(o,oi){
        var inv=p.modInv && p.modInv[modId] && p.modInv[modId][oi];
        return {l:o.l, p:o.p||0, inv:inv||undefined};
      })};
    if(tipo==='distribuir'){ grupo.min=m.minCant||0; grupo.max=m.maxCant||0; }
    return grupo;
  }).filter(Boolean);
  return Object.assign({}, p, {mods: deLaBiblioteca.concat(p.mods||[])});
}

/* ---- Alerta sonora (pedido nuevo en Monitor) ---- */
var _audioCtx=null;
function unlockAudio(){ try{ if(!_audioCtx){ _audioCtx=new (window.AudioContext||window.webkitAudioContext)(); } if(_audioCtx.state==='suspended'){ _audioCtx.resume(); } }catch(e){} }
function _campana(freq,delay,dur,vol){
  setTimeout(function(){
    try{
      var t0=_audioCtx.currentTime;
      var o=_audioCtx.createOscillator(), o2=_audioCtx.createOscillator();
      var g=_audioCtx.createGain(), g2=_audioCtx.createGain();
      o.type='sine'; o.frequency.value=freq;
      o2.type='sine'; o2.frequency.value=freq*2; g2.gain.value=0.12;
      g.gain.setValueAtTime(0.0001,t0);
      g.gain.exponentialRampToValueAtTime(vol,t0+0.015);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
      o2.connect(g2); g2.connect(g);
      o.connect(g); g.connect(_audioCtx.destination);
      o.start(t0); o.stop(t0+dur+0.05);
      o2.start(t0); o2.stop(t0+dur+0.05);
    }catch(e){}
  },delay);
}
function playAlertSound(){ unlockAudio(); if(!_audioCtx) return; _campana(659.25,0,0.55,0.28); _campana(523.25,260,0.75,0.28); }

function updateKdsTimers(){
  document.querySelectorAll('.kdc-timer').forEach(function(el){
    var ts=parseInt(el.dataset.ts,10); if(!ts){ el.textContent='--:--'; return; }
    var diff=Math.max(0,Date.now()-ts);
    var mm=Math.floor(diff/60000), ss=Math.floor((diff%60000)/1000);
    el.textContent=(mm<10?'0':'')+mm+':'+(ss<10?'0':'')+ss;

  });
}

function switchView(v){
  if(!PERMISOS[state.role][v]){ showToast('Tu rol no puede acceder a esta seccion'); return; }
  state.view=v; renderTopbar();
  if(v==='menu'){ goMenu(); }
  else if(v==='mesas'){ showAppView('mesas'); renderMesas(); }
  else if(v==='kds'){ showAppView('kds'); renderKds(); }
  else if(v==='pedidos'){ showAppView('pedidos'); renderPedidos(); }
  else if(v==='config'){ showAppView('config'); renderConfig(); }
  else if(v==='caja'){ showAppView('caja'); renderCaja(); }
}

function pedirDatosDomicilio(){

    '<div class="sub" style="margin-bottom:12px">Servicio a domicilio</div>'+

    '<div class="field"><label>Direcci\u00f3n</label><input id="dDir" value="'+esc(c.direccion||'')+'" placeholder="Calle, n\u00famero, colonia"></div>'+
    '<div class="field"><label>Referencia</label><input id="dRef" value="'+esc(c.referencia||'')+'" placeholder="Entre calles, color de casa..."></div>'+
    '<div class="modal-actions"><button class="btn-cancel" id="mCancel">Cancelar</button><button class="btn-confirm" id="mOk">Continuar</button></div></div></div>';
  var telInput=document.getElementById('dTel'), telStatus=document.getElementById('dTelStatus');
  function fmtTel(v){ var d=String(v).replace(/\D/g,'').slice(0,10); if(d.length<=3) return d.length? '('+d : ''; return '('+d.slice(0,3)+')'+d.slice(3); }
  telInput.value=fmtTel(telInput.value);
  var lookupTimer=null, lastLookedUp=''; state._clienteEncontrado=null;
  telInput.addEventListener('input',function(){
    telInput.value=fmtTel(telInput.value);
    clearTimeout(lookupTimer);
    var tel=telInput.value.replace(/\D/g,'');
    if(tel.length!==10||tel===lastLookedUp){ telStatus.textContent=''; return; }
    lookupTimer=setTimeout(function(){
      lastLookedUp=tel; telStatus.textContent='Buscando cliente...';
      fbBuscarClienteUnificado(tel).then(function(res){
        if(telInput.value.replace(/\D/g,'')!==tel) return;
        if(res && res.cliente){
          var cl=res.cliente; state._clienteEncontrado=cl;
          if(cl.nombre && !document.getElementById('dNombre').value.trim()) document.getElementById('dNombre').value=cl.nombre;
          if(cl.direccion && !document.getElementById('dDir').value.trim()) document.getElementById('dDir').value=cl.direccion;
          if(cl.referencia && !document.getElementById('dRef').value.trim()) document.getElementById('dRef').value=cl.referencia;
          if(res.origen==='lealtad'){
            telStatus.innerHTML='<b style="color:var(--verde-ok);">\u2713 '+etiquetaCliente(cl.visitas)+'</b> &middot; '+(cl.puntos||0)+' puntos disponibles';
          } else {
            telStatus.textContent='Cliente conocido (a\u00fan no inscrito a Puntos de Lealtad) \u2014 revisa sus datos';
          }
        } else {
          state._clienteEncontrado=null;
          telStatus.textContent='Cliente nuevo \u2014 captura sus datos';
        }
      }).catch(function(){ telStatus.textContent=''; });
    },400);
  });
  bindModal(function(){
    var tel=document.getElementById('dTel').value.replace(/\D/g,'');
    var nombre=document.getElementById('dNombre').value.trim();
    if(tel.length!==10){ showToast('Captura los 10 d\u00edgitos del tel\u00e9fono'); return; }
    if(!nombre){ showToast('Captura el nombre del cliente'); return; }
    var dir=document.getElementById('dDir').value.trim();
    var ref=document.getElementById('dRef').value.trim();
    state.cliente={nombre:nombre,telefono:tel,direccion:dir,referencia:ref};
    state.tipoOrden='domicilio';
    var cl=state._clienteEncontrado;
    state.puntosDisponibles=cl?(cl.puntos||0):0; state.usarPuntos=false; state.puntosUsados=0;
    fbGuardarCliente(tel,{nombre:nombre,direccion:dir,referencia:ref}).catch(function(){});
    var prods=CATALOG[state.sucursal]||[];
    state.menu=prods.length?menusOf(prods)[0]:null; state.sub=null; state.search='';

function menusOf(prods){
  var s=[]; var hasFav=false;
  prods.forEach(function(p){ if(p.fav===true)hasFav=true; if(s.indexOf(p.menu)<0) s.push(p.menu); });
  var orden=(CATEGORIAS_ORDEN_CACHE[state.sucursal]||{}).categorias;
  s=_ordenarConGuardado(s,orden);
  if(hasFav) s.unshift('Favoritos');
  return s;
}
function subsOf(prods,menu){
  var s=[];
  prods.forEach(function(p){ if(p.menu===menu && s.indexOf(p.sub)<0) s.push(p.sub); });
  var ordenSub=((CATEGORIAS_ORDEN_CACHE[state.sucursal]||{}).subcategorias||{})[menu];
  s=_ordenarConGuardado(s,ordenSub);
  s.unshift('Todos');
  return s;
}
function currentProducts(){
  var prods=CATALOG[state.sucursal]||[];
  var isFav=(state.menu==='Favoritos');
  return prods.filter(function(p){
    var okMenu=isFav?(p.fav===true):(p.menu===state.menu);
    var okSub=isFav?true:(!state.sub||p.sub===state.sub);
    var okSearch=!state.search||(p.name.toLowerCase().indexOf(state.search.toLowerCase())>=0);
    return okMenu&&okSub&&okSearch;
  }).sort(function(a,b){ return String(a.name).localeCompare(String(b.name),'es'); });
}

function abrirEdicionCarrito(uid){
  var l=state.cart.filter(function(x){return x.uid==uid;})[0]; if(!l) return;
  var prodCat=(CATALOG[state.sucursal]||[]).filter(function(x){return x.id===l.id;})[0];
  if(!prodCat){ showToast('Ya no se encuentra este artículo en el catálogo, no se puede editar'); return; }
  var p=_resolverModsProducto(prodCat);
  _modP=p; _modEditUid=uid;
  _modSel=l.modSel?JSON.parse(JSON.stringify(l.modSel)):{};
  _modSize=l.size||((p.sized&&p.prices)?Object.keys(p.prices)[0]:null);
  _modNote=l.note||'';
  _modCustomMonto=(_modSize==='Personalizado')?(l.price||0):0;
  _modQty=l.qty||1;
  renderMods();

function modsTotal(){
  var p=_modP; if(!p) return 0;
  var base = (p.sized && p.prices && _modSize!=null)? (_modSize==='Personalizado'?(_modCustomMonto||0):p.prices[_modSize]) : p.price;
  var extra=0;
  (p.mods||[]).forEach(function(g,gi){
    var sel=_modSel[gi];
    if(g.type==='distribuir'){ (sel||[]).forEach(function(cant,oi){ extra+= cant*((g.opts[oi]&&g.opts[oi].p)||0); }); }
    else if(g.type==='multi'){ (sel||[]).forEach(function(oi){ extra+= (g.opts[oi]&&g.opts[oi].p)||0; }); }
    else if(sel>-1 && g.opts[sel]){ extra+= g.opts[sel].p||0; }
  });
  return base+extra;
}

function confirmMods(){
  var p=_modP; if(!p) return;
  if(p.sized && _modSize==='Personalizado' && !(_modCustomMonto>0)){ showToast('Escribe el monto a cobrar'); return; }
  var parts=[]; if(_modSize) parts.push(_modSize==='Personalizado'?'Monto libre':_modSize);
  var missing=false; var modDeltas=[];
  function _agregarDeltaOpt(o,mult){
    if(!o||!o.inv) return;
    // Cada tamaño tiene su propia receta (con cantidades distintas), asi que
    // el efecto en inventario del modificador tambien se guarda por tamaño.
    var key=p.sized?_modSize:'__default__';
    var inv=o.inv[key];
    if(!inv) return;
    if(inv.modo==='agrega' && inv.agrega){ modDeltas.push({articulo:inv.agrega.articulo, cantidad:inv.agrega.cantidad*mult}); }
    else if(inv.modo==='quita' && inv.quita){ modDeltas.push({articulo:inv.quita.articulo, cantidad:-inv.quita.cantidad*mult}); }
    else if(inv.modo==='sustituye' && inv.quita && inv.pon){
      modDeltas.push({articulo:inv.quita.articulo, cantidad:-inv.quita.cantidad*mult});
      modDeltas.push({articulo:inv.pon.articulo, cantidad:inv.pon.cantidad*mult});
    }
  }
  (p.mods||[]).forEach(function(g,gi){
    var sel=_modSel[gi];
    if(g.type==='distribuir'){
      var suma=distribuirSuma(sel);
      var gMin=(typeof g.min==='number')?g.min:(g.req?g.total:0);
      var gMax=(typeof g.max==='number')?g.max:g.total;
      if(suma<gMin || suma>gMax){ missing=true; return; }
      (g.opts||[]).forEach(function(o,oi){ if(sel[oi]>0){ parts.push(sel[oi]+' '+o.l); _agregarDeltaOpt(o,sel[oi]); } });
    }
    else if(g.type==='multi'){ (sel||[]).forEach(function(oi){ if(g.opts[oi]){ parts.push(g.opts[oi].l); _agregarDeltaOpt(g.opts[oi],1); } }); if(g.req && (!sel||!sel.length)) missing=true; }
    else { if(sel>-1 && g.opts[sel]){ parts.push(g.opts[sel].l); _agregarDeltaOpt(g.opts[sel],1); } else if(g.req) missing=true; }
  });
  if(missing){ showToast('Completa las opciones requeridas'); return; }
  var price=modsTotal();
  var label=parts.join(' · ');
  var lineaObj={uid:(_modEditUid||(Date.now()+Math.random())),id:p.id,name:p.name,price:price,qty:_modQty,note:_modNote.trim(),mods:label,area:areaDe(p),size:(p.sized?_modSize:null),modDeltas:modDeltas,modSel:JSON.parse(JSON.stringify(_modSel))};
  if(_modEditUid){
    var idxEdit=state.cart.findIndex(function(x){return x.uid==_modEditUid;});
    if(idxEdit>-1) state.cart[idxEdit]=lineaObj; else state.cart.push(lineaObj);
  } else {
    state.cart.push(lineaObj);
  }
  renderTopbar(); renderCart(); closeMods();
}
function changeQty(uid,d){
  var l=state.cart.filter(function(x){return x.uid==uid;})[0]; if(!l) return; l.qty+=d;
  if(l.qty<=0){ state.cart=state.cart.filter(function(x){return x.uid!=uid;}); }
  renderCart();
}
function clearCart(){ state.cart=[]; state.descuento={tipo:null,valor:0}; state.cargoDomicilio=0; renderTopbar(); renderCart(); }
function cartSubtotal(){ return state.cart.reduce(function(s,l){return s+l.price*l.qty;},0); }
function puntosMontoUsado(){
  if(!state.usarPuntos || !(state.puntosDisponibles>0)) return 0;
  var baseSinPuntos=cartSubtotal()-cartDescuentoMonto();
  return Math.min(state.puntosDisponibles, Math.max(0,baseSinPuntos));
}
function toggleUsarPuntos(){

}
function cartDescuentoMonto(){
  var sub=cartSubtotal();
  if(state.descuento.tipo==='porcentaje'){ return sub*(state.descuento.valor/100); }
  if(state.descuento.tipo==='monto'){ return Math.min(state.descuento.valor,sub); }

}

function cartTotalFinal(){ var __cargo=(state.tipoOrden==='domicilio')?(state.cargoDomicilio||0):0; var base=cartSubtotal()-cartDescuentoMonto()-puntosMontoUsado(); return base+__cargo; }
/* ==== Pantalla de cliente (segundo monitor): transmite el pedido en construccion
   en vivo via cajaLive/{suc}, para que display.html lo muestre. Debounce corto

var _cajaLiveDebounce=null;
function _broadcastCajaLive(){
  if(!state.logged || !state.sucursal) return;

    _cajaLiveDebounce=null;

    var payload={ activo:items.length>0, items:items, subtotal:cartSubtotal(), descuento:cartDescuentoMonto(), total:cartTotalFinal(), tipoOrden:state.tipoOrden||null, mesa:state.mesa||null, ts:Date.now() };
    fbAuthReady.then(function(){ fbDb.ref('cajaLive/'+state.sucursal).set(payload).catch(function(){}); });
  }, 250);
}

      } else {

        var chk=document.getElementById('chkInscribir'); if(chk) chk.addEventListener('change',function(){ state._debeInscribir=chk.checked; });
        state._debeInscribir=true;
      }
    }).catch(function(){ estadoEl.textContent=''; });
  }
  telInput.addEventListener('input',function(){
    clearTimeout(buscarTimer);
    var tel=telInput.value.replace(/\D/g,'');

    buscarTimer=setTimeout(function(){ ultimaBusqueda=tel; actualizarEstado(tel); },400);
  });
  if(telActual.replace(/\D/g,'').length===10){ ultimaBusqueda=telActual.replace(/\D/g,''); actualizarEstado(ultimaBusqueda); }
  bindModal(function(){
    var nombre=document.getElementById('clienteNombreTxt').value.trim();

    state.puntosUsados=0;

/* ---- Cobro: se agregan uno o varios pagos hasta cubrir el total ---- */
function _pagoRerender(){ if(state.checkoutOpen) renderCheckout(); else if(_cobroPedidoIx!=null) renderCobroPedido(); }
function seleccionarMetodoDividido(m){ state.dividirMetodoSel=m; _pagoRerender(); }
function totalPagosDivididos(){ return state.pagosDivididos.reduce(function(s,p){return s+p.monto;},0); }
function agregarPagoDividido(total,monto){
  monto=parseFloat(monto)||0;
  if(monto<=0){ showToast('Escribe un monto válido'); return; }
  var restanteAntes=total-totalPagosDivididos();
  if(state.dividirMetodoSel!=='efectivo' && monto>restanteAntes+0.004){ showToast('Ese monto excede lo que falta por cobrar'); return; }
  state.pagosDivididos.push({metodo:state.dividirMetodoSel,monto:monto});
  _pagoRerender();
}
function quitarPagoDividido(i){ state.pagosDivididos.splice(i,1); _pagoRerender(); }
function puedeConfirmarPago(total){
  var restante=total-totalPagosDivididos();
  if(restante>0.004) return false;
  if(restante<-0.004){ return state.pagosDivididos.some(function(p){return p.metodo==='efectivo';}); }
  return state.pagosDivididos.length>0;
}
function _htmlPagos(total){
  var pagado=totalPagosDivididos();
  var restante=total-pagado;
  var metodos=['efectivo','tarjeta','transferencia','rappi'];
  var h='<div class="mgroup" style="margin:10px 0"><div class="mg-l">Pagos</div>';
  if(!state.pagosDivididos.length){ h+='<div class="cart-empty" style="padding:8px 0;font-size:13px">Agrega el primer pago abajo</div>'; }
  else{
    h+=state.pagosDivididos.map(function(pg,i){
      return '<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--linea)"><span>'+esc(PAGO_LABEL[pg.metodo])+'</span><span style="font-weight:700;margin-left:auto;margin-right:10px">'+money(pg.monto)+'</span><button data-quitardiv="'+i+'" style="color:var(--rojo);background:none;border:none;font-size:20px;line-height:1">&times;</button></div>';
    }).join('');
  }
  h+='<div style="display:flex;justify-content:space-between;padding-top:10px;font-weight:800;font-size:16px"><span>'+(restante>0.004?'Restante':(restante<-0.004?'Cambio':'Completo'))+'</span><span style="color:'+(restante>0.004?'var(--rojo)':'#1a7f37')+'">'+money(Math.abs(restante))+'</span></div></div>';
  if(restante>0.004){
    h+='<div class="pay-grid">'+metodos.map(function(m){return '<button class="pay-btn dividir-metodo'+(state.dividirMetodoSel===m?' active':'')+'" data-dm="'+m+'">'+esc(PAGO_LABEL[m])+'</button>';}).join('')+'</div>';
    h+='<div class="cash-box"><input id="dividirMontoInp" type="number" inputmode="decimal" placeholder="Monto" value="'+(restante>0?restante.toFixed(2):'')+'">'+
      (state.dividirMetodoSel==='efectivo'?('<div class="quick-cash">'+[100,200,500,1000].map(function(v){return '<button data-cashdiv="'+v+'">$'+v+'</button>';}).join('')+'<button data-cashdiv="exact">Exacto</button></div>'):'')+
      '<button class="btn-confirm" id="btnAgregarPagoDividido" style="width:100%;margin-top:8px">+ Agregar '+esc(PAGO_LABEL[state.dividirMetodoSel])+'</button></div>';
  }
  return h;
}

function renderCheckout(){
  if(!state.checkoutOpen){ closeModal(); return; }

function _construirPedidoDesdeCart(estado,metodo,pagos){
  var itemsPedido=state.cart.map(function(l){return {id:l.id||null,name:l.name,qty:l.qty,price:l.price,note:l.note,mods:l.mods||'',area:l.area||'barra',size:l.size||null,modDeltas:l.modDeltas||[],listo:l.listo||false,listoTs:l.listoTs||null};});
  // Si se esta reeditando un pedido que ya tenia productos marcados listos en
  // el Monitor, esos avances no deben perderse solo por agregar/quitar algo
  // mas -- el area se considera lista si TODOS sus productos ya lo estan.
  var itsBarra=itemsPedido.filter(function(l){return (l.area||'barra')==='barra';});
  var itsCocina=itemsPedido.filter(function(l){return (l.area||'barra')==='cocina';});
  var estadoBarraVal=itsBarra.length?(itsBarra.every(function(l){return l.listo;})?'listo':'pendiente'):'listo';
  var estadoCocinaVal=itsCocina.length?(itsCocina.every(function(l){return l.listo;})?'listo':'pendiente'):'listo';
  var editKey=state._editandoPedidoKey;
  var fbRef=editKey?fbPedidosRef(state.sucursal).child(editKey):fbPedidosRef(state.sucursal).push();
  var nid=editKey?state._editandoPedidoId:('#'+fbRef.key.replace(/[^a-zA-Z0-9]/g,'').slice(-5).toUpperCase());
  var pedidoObj={id:nid,tipo:state.mesa?'aqui':state.tipoOrden,metodo:metodo,total:cartTotalFinal(),estado:estado,hora:new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'}),mesa:state.mesa,descuento:{tipo:state.descuento.tipo,valor:state.descuento.valor},items:itemsPedido,cliente:state.cliente||null,estadoBarra:estadoBarraVal,estadoCocina:estadoCocinaVal,_ts:firebase.database.ServerValue.TIMESTAMP};
  if(pagos && pagos.length) pedidoObj.pagos=pagos;
  // Se ofrece al repartidor desde que entra el pedido, aunque siga en preparacion --
  // asi puede ir en camino y no hasta que la Estacion lo marque listo.
  if(pedidoObj.tipo==='domicilio') pedidoObj.estadoReparto='disponible';
  return {ref:fbRef,obj:pedidoObj};
}

function procesarInventario(lines,suc){
  if(!SYNC.configurado()){ return; } // sin token de sincronizacion no hay como descontar de verdad
  var acumulado={}; var sinReceta=[];
  lines.forEach(function(l){
    var huboAlgo=false;
    var idReceta=_idRecetaDeLinea(l);
    var det=idReceta && RECETAS_CACHE.detallesPorReceta[idReceta];
    if(det && det.length){
      huboAlgo=true;
      det.forEach(function(x){ acumulado[x.articulo]=(acumulado[x.articulo]||0)+(x.cantidad*l.qty); });
    }
    // Deltas de modificadores (agregan o sustituyen ingrediente de la receta
    // base) -- se aplican aunque el producto no tenga receta propia todavia.
    (l.modDeltas||[]).forEach(function(d){
      if(!d.articulo || !d.cantidad) return;
      huboAlgo=true;
      acumulado[d.articulo]=(acumulado[d.articulo]||0)+(d.cantidad*l.qty);
    });
    if(!huboAlgo) sinReceta.push(l.name);
  });
  if(sinReceta.length) showToast('Sin receta, no se descuenta: '+sinReceta.join(', '));
  // Una sustitucion puede dejar un ingrediente en 0 o negativo (si se quito
  // mas de lo que la receta base aportaba) -- no tiene sentido descontar
  // cantidades negativas, se acota en 0.
  var items=Object.keys(acumulado).map(function(art){ return {articulo:art, cantidad:Math.max(0,acumulado[art])}; }).filter(function(it){ return it.cantidad>0; });
  if(!items.length) return;
  SYNC.descontarInventario(items, suc?suc.inventario:null).then(function(res){
    if(res && res.alertas && res.alertas.length){ res.alertas.forEach(function(a){ showToast('Reponer urgente: '+a); }); }
    if(res && res.noEncontrados && res.noEncontrados.length){ showToast('No existen en Inventario (no se descontaron): '+res.noEncontrados.join(', ')); }
  }).catch(function(e){ console.error('descontarInventario', e); });
}

function marcarMesaOcupada(suc,n,total){ fbDb.ref('mesasEstado/'+suc+'/'+n).set({estado:'ocupada',total:total||0}).catch(function(e){ console.error(e); }); }
function liberarMesa(suc,n){ fbDb.ref('mesasEstado/'+suc+'/'+n).remove().catch(function(e){ console.error(e); }); }
function getMesas(suc){
  var n=numMesasConfig(suc);
  var base=MESAS_MOCK[suc]||[];
  var byN={}; base.forEach(function(m){ byN[m.n]=m; });

  for(var i=1;i<=n;i++){ var m=byN[i]?Object.assign({},byN[i]):{n:i,estado:'libre'}; if(ov[i]){ m.estado=ov[i].estado; if(ov[i].estado==='ocupada'){ m.total=ov[i].total; } else { delete m.total; } } arr.push(m); }
  return arr;
}

function kdsSetArea(a){ state.kdsArea=a; renderKds(); }
// Marca UN producto especifico de la comanda como listo (no toda el area
// de un jalon) -- si con ese ya quedan listos todos los de esa area, el
// area completa se marca lista igual que antes (todo lo demas del sistema
// -- avisar repartidor, bloquear cierre de turno, badge del KDS -- sigue
// leyendo estadoBarra/estadoCocina, asi que se mantienen sincronizados).
function kdsMarcarProductoListo(ix,area,itemIndex){
  var p=state.pedidos[ix]; if(!p||!p._fbKey) return;
  var items=(p.items||[]).slice();
  if(!items[itemIndex]) return;
  items[itemIndex]=Object.assign({},items[itemIndex],{listo:true,listoTs:Date.now()});
  var campo=area==='cocina'?'estadoCocina':'estadoBarra';
  var todosListos=items.filter(function(l){return (l.area||'barra')===area;}).every(function(l){return !!l.listo;});
  var upd={items:items};
  if(todosListos) upd[campo]='listo';
  var otra=area==='cocina'?p.estadoBarra:p.estadoCocina;
  var quedaListoPedido=todosListos && (!otra || otra==='listo');
  fbPedidosRef(state.sucursal).child(p._fbKey).update(upd).then(function(){
    if(p.tipo==='domicilio' && quedaListoPedido && p.repartidorId) _avisarRepartidorListo(Object.assign({},p,upd));
  }).catch(function(e){ showToast('Sin conexión con el monitor -- reintenta'); console.error(e); });
}
// Atajo para marcar de un tiron todo lo que falte de esa area (comandas
// sencillas donde no hace falta ir producto por producto).
function kdsMarcarListo(ix,area){
  var p=state.pedidos[ix]; if(!p||!p._fbKey) return;
  var items=(p.items||[]).map(function(l){ if((l.area||'barra')===area && !l.listo){ return Object.assign({},l,{listo:true,listoTs:Date.now()}); } return l; });
  var campo=area==='cocina'?'estadoCocina':'estadoBarra';
  var upd={items:items}; upd[campo]='listo';
  var otra=area==='cocina'?p.estadoBarra:p.estadoCocina;
  var quedaListo=(!otra || otra==='listo');
  fbPedidosRef(state.sucursal).child(p._fbKey).update(upd).then(function(){
    if(p.tipo==='domicilio' && quedaListo && p.repartidorId) _avisarRepartidorListo(Object.assign({},p,upd));
  }).catch(function(e){ showToast('Sin conexión con el monitor -- reintenta'); console.error(e); });
  showToast('Comanda '+p.id+' ('+(AREA_LABEL[area]||area)+') marcada como lista');
}
function renderKds(){
  var area=state.kdsArea||'todas';
  var tabs='<div class="kds-filter">'+
    ['todas','barra','cocina'].map(function(a){ return '<button class="kds-f'+(area===a?' on':'')+'" onclick="kdsSetArea(\''+a+'\')">'+(a==='todas'?'Todas':AREA_LABEL[a])+'</button>'; }).join('')+'</div>';
  var pedidosAbiertos=state.pedidos.filter(function(p){ return (p.estadoBarra&&p.estadoBarra!=='listo')||(p.estadoCocina&&p.estadoCocina!=='listo'); });
  var cards='';
  pedidosAbiertos.forEach(function(p){
    var ix=state.pedidos.indexOf(p);
    ['barra','cocina'].forEach(function(ar){
      if(area!=='todas'&&area!==ar) return;
      var estado=ar==='cocina'?p.estadoCocina:p.estadoBarra;
      if(!estado||estado==='listo') return;
      var itsConIdx=[]; (p.items||[]).forEach(function(l,li){ if((l.area||'barra')===ar) itsConIdx.push({l:l,li:li}); });
      if(!itsConIdx.length) return;
      var pendientes=itsConIdx.filter(function(x){return !x.l.listo;}).length;
      var rows=itsConIdx.map(function(x){
        var l=x.l, li=x.li;
        return '<div class="kdc-item'+(l.listo?' kdc-item-listo':'')+'"><div class="kdc-item-info"><span class="kdc-q">'+l.qty+'x</span><span class="kdc-n">'+esc(l.name)+(l.mods?'<div class="kdc-mods">'+esc(l.mods)+'</div>':'')+(l.note?'<div class="kdc-note">'+esc(l.note)+'</div>':'')+'</span></div>'+
          (l.listo?'<span class="kdc-check">&#10003;</span>':'<button class="kdc-item-btn" onclick="kdsMarcarProductoListo('+ix+',\''+ar+'\','+li+')">Listo</button>')+
        '</div>';
      }).join('');
      cards+='<div class="kds-card '+ar+'"><div class="kdc-top"><span class="kdc-folio">'+esc(p.id)+'</span><span class="kdc-timer" data-ts="'+(p._ts||0)+'">--:--</span><span class="kdc-area">'+AREA_LABEL[ar]+(pendientes<itsConIdx.length?' &middot; '+pendientes+' pend.':'')+'</span></div><div class="kdc-meta">'+esc(TIPO_LABEL[p.tipo]||p.tipo)+(p.mesa?' &middot; Mesa '+esc(p.mesa):'')+' &middot; '+esc(p.hora)+(p.cliente&&p.cliente.nombre?' &middot; <b>'+esc(p.cliente.nombre)+'</b>':'')+'</div>'+rows+(pendientes>1?'<button class="kdc-btn" onclick="kdsMarcarListo('+ix+',\''+ar+'\')">Marcar todo listo</button>':'')+'</div>';
    });
  });
  if(!cards) cards='<div class="cart-empty">Sin comandas pendientes</div>';
  var html='<h2>Monitor de estaci&oacute;n</h2><div class="sub">Comandas por elaborar (sustituye la impresi&oacute;n de tickets)</div>'+tabs+'<div class="kds-grid">'+cards+'</div>';
  document.getElementById('kdsContent').innerHTML=html;
}
function selectMesa(n){
  // Si la mesa ya tiene una cuenta abierta real, se continua esa cuenta
  // (se carga lo que ya lleva consumido) en vez de empezar una nueva.
  var abierto=state.pedidos.filter(function(p){ return p.tipo==='aqui' && p.mesa===n && p.estado==='abierto'; })[0];
  if(abierto){ editarPedido(state.pedidos.indexOf(abierto)); return; }
  // No hay cuenta real detras -- si la mesa habia quedado marcada ocupada
  // (ej. se toco sin llegar a guardar nada), se libera sola en vez de
  // quedarse "fantasma" bloqueando la mesa.
  liberarMesa(state.sucursal,n);
  state.mesa=n; state.tipoOrden='aqui'; state.view='menu'; state.cart=[];
  state._editandoPedidoKey=null; state._editandoPedidoId=null;
  var prods=CATALOG[state.sucursal]||[]; state.menu=menusOf(prods)[0]; state.sub=null;
  renderTopbar(); showAppView('pos'); renderPos(); showToast('Mesa '+n+' seleccionada');
}
function confirmarLiberarMesa(n){
  var abierto=state.pedidos.filter(function(p){ return p.tipo==='aqui' && p.mesa===n && p.estado==='abierto'; })[0];
  if(abierto){
    if(!confirm('La mesa '+n+' tiene una cuenta abierta de '+money(abierto.total)+'. ¿Cancelarla y liberar la mesa? Esta acción no se puede deshacer.')) return;
    fbPedidosRef(state.sucursal).child(abierto._fbKey).update({estado:'cancelado',estadoBarra:'listo',estadoCocina:'listo'}).catch(function(e){ console.error(e); });
  }
  liberarMesa(state.sucursal,n);
  showToast('Mesa '+n+' liberada');
}

/** Cierra la caja/turno sin pasar por el corte -- para destrabar una caja abierta

function cerrarCajaSinCorte(){
  var __pend=(state.pedidos||[]).filter(function(p){ return (p.estadoBarra&&p.estadoBarra!=='listo')||(p.estadoCocina&&p.estadoCocina!=='listo'); });

  if(__abiertas.length) partes.push(__abiertas.length+' cuenta(s) abierta(s) sin cobrar');
  var msg = partes.length
    ? ('Vas a cerrar la caja SIN hacer corte. Se perderá: '+partes.join(', ')+'. Úselo solo para destrabar una caja de pruebas o un turno que ya no aplica -- no para el cierre normal del día. ¿Continuar?')
    : '¿Cerrar la caja? No hay ventas ni pendientes en este turno, así que no hay nada que perder.';
  if(!confirm(msg)) return;
  fbLimpiarTurnoSales(state.sucursal);
  fbLimpiarPedidos(state.sucursal);

  showToast('Caja cerrada sin corte');
}

var SYNC = {
  URL_KEY: "ls_webapp_url",
  TOKEN_KEY: "ls_write_token",
  DEFAULT_URL: "https://script.google.com/macros/s/AKfycbwWsUIXoYDN_XayVBNDk6pshHL81WtxA_whT_tjy8tOQGhqxpVsKFqk2a-kDZyZmCCk/exec",
  getUrl: function(){ return localStorage.getItem(this.URL_KEY) || this.DEFAULT_URL; },
  getToken: function(){ return localStorage.getItem(this.TOKEN_KEY) || ""; },
  setUrl: function(v){ localStorage.setItem(this.URL_KEY, (v||"").trim()); },
  setToken: function(v){ localStorage.setItem(this.TOKEN_KEY, (v||"").trim()); },
  configurado: function(){ return !!this.getToken(); },
  sucursalSheet: function(sucId){
    var suc = SUCURSALES.filter(function(s){ return s.id===sucId; })[0];
    return suc && suc.inventario ? suc.inventario : (suc? String(suc.nombre).toUpperCase() : "");
  },
  enviarCorte: function(payload){
    var url = this.getUrl(), token = this.getToken();
    if(!token){ return Promise.reject(new Error("SIN_TOKEN")); }
    var body = { token: token, accion: "registrarIngresoCompleto", datos: payload };
    return fetch(url, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) }).then(function(r){ return r.json(); });
  },
  buscarClienteDom: function(telefono){
    var url = this.getUrl(), token = this.getToken();
    if(!token) return Promise.resolve({ok:false,cliente:null});
    var body = { token: token, accion: "buscarClienteDom", datos: { telefono: telefono } };
    return fetch(url, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) }).then(function(r){ return r.json(); });
  },
  registrarClienteDom: function(cliente){
    var url = this.getUrl(), token = this.getToken();
    if(!token) return Promise.resolve({ok:false});
    var body = { token: token, accion: "registrarClienteDom", datos: cliente };
    return fetch(url, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) }).then(function(r){ return r.json(); });
  },
  obtenerCorteDia: function(sucursal, turno, fecha){
    var url = this.getUrl(), token = this.getToken();
    if(!token) return Promise.resolve({ok:false, encontrado:false});
    var body = { token: token, accion: "obtenerCorteDia", datos: { sucursal: sucursal, turno: turno, fecha: fecha } };
    return fetch(url, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) }).then(function(r){ return r.json(); }).catch(function(){ return {ok:false, encontrado:false}; });
  },
  descontarInventario: function(items, sucursalInventario){
    var url = this.getUrl(), token = this.getToken();
    if(!token || !sucursalInventario) return Promise.resolve({status:'ok', actualizados:0});
    var body = { token: token, accion: "descontarInventarioVenta", datos: { sucursal: sucursalInventario, items: items } };
    return fetch(url, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) }).then(function(r){ return r.json(); });
  }
};
var _reenviarEnCurso=false;
function reenviarCortesPendientes(){
  if(_reenviarEnCurso) return;
  var arr=[]; try{ arr=JSON.parse(localStorage.getItem("ls_cortes_pendientes")||"[]"); }catch(e){}
  if(!arr.length){ showToast("No hay cortes pendientes"); return; }
  if(!SYNC.configurado()){ showToast("Configura primero la URL y el token"); return; }
  _reenviarEnCurso=true;
  var btnRe=document.getElementById("btnReenviarPend"); if(btnRe){ btnRe.disabled=true; btnRe.textContent="Enviando..."; }
  showToast("Enviando "+arr.length+" corte(s) pendiente(s)...");
  var quedan=[]; var ok=0;
  var siguiente=function(i){
    if(i>=arr.length){
      localStorage.setItem("ls_cortes_pendientes", JSON.stringify(quedan));
      showToast(ok+" corte(s) enviado(s)"+(quedan.length?(", "+quedan.length+" siguen pendientes"):""));
      _reenviarEnCurso=false;
      if(typeof configSync==="function") configSync();
      return;
    }
    SYNC.enviarCorte(arr[i].payload).then(function(res){
      if(res && (res.ok||res.status==="ok"||res.id)){ ok++; } else { quedan.push(arr[i]); }
      siguiente(i+1);
    }).catch(function(){ quedan.push(arr[i]); siguiente(i+1); });
  };
  siguiente(0);
}

  if(!SYNC.configurado()){ guardarCortePendiente(payload); _finalizar("Turno cerrado (guardado local – falta configurar sincronización)"); return; }

(function(){
  function enhanceGroup(g){
    if(g.__enh){ syncSel(g); return; }
    g.__enh=true;
    var lbl=g.querySelector('.mg-l');
    if(lbl){
      var req=g.querySelector('.req');
      var sub=document.createElement('div'); sub.className='mg-sub';
      sub.textContent = req ? 'Obligatoria \u00b7 Elige 1' : 'Opcional';
      lbl.insertAdjacentElement('afterend', sub);
    }
    var opts=[].slice.call(g.querySelectorAll('label.mopt'));
    if(opts.length){
      var grid=document.createElement('div'); grid.className='mopts-grid';
      opts[0].parentNode.insertBefore(grid, opts[0]);
      opts.forEach(function(o){ grid.appendChild(o); });
    }
    g.addEventListener('change', function(){ syncSel(g); });
    syncSel(g);
  }
  function syncSel(g){
    g.querySelectorAll('label.mopt').forEach(function(o){
      var inp=o.querySelector('input');
      if(inp && inp.checked) o.classList.add('sel'); else o.classList.remove('sel');
    });
  }
  function scan(){ var box=document.getElementById('modsBox'); if(!box) return; box.querySelectorAll('.mgroup').forEach(enhanceGroup); }
  var mo=new MutationObserver(function(){ scan(); });
  document.addEventListener('DOMContentLoaded', function(){ mo.observe(document.body,{childList:true,subtree:true}); scan(); });
})();

(function(){
  var LSKEY='luna_agotados';
  function getAgo(){ try{ return JSON.parse(localStorage.getItem(LSKEY)||'{}'); }catch(e){ return {}; } }
  function setAgo(m){ try{ localStorage.setItem(LSKEY, JSON.stringify(m)); }catch(e){} }
  function isAgo(id){ return !!getAgo()[id]; }
  function toggle(id){ var m=getAgo(); if(m[id]) delete m[id]; else m[id]=1; setAgo(m); applyGrid(); }
  function decorate(btn){
    var id=btn.getAttribute('data-id'); if(!id) return;
    if(!btn.__eye){
      var eye=document.createElement('span'); eye.className='prod-eye';
      eye.addEventListener('click', function(ev){ ev.stopPropagation(); ev.preventDefault(); toggle(id); });
      btn.appendChild(eye); btn.__eye=eye;
      var badge=document.createElement('span'); badge.className='prod-badge-ago'; badge.textContent='AGOTADO'; badge.style.display='none';
      btn.appendChild(badge); btn.__badge=badge;
    }
    var ago=isAgo(id);
    btn.classList.toggle('agotado', ago);
    btn.__eye.textContent = ago ? '\u{1F6AB}' : '\u{1F441}';
    btn.__eye.title = ago ? 'Marcar disponible' : 'Agotar art\u00edculo';
    btn.__badge.style.display = ago ? 'block' : 'none';
  }
  function applyGrid(){ var grid=document.getElementById('prodGrid'); if(!grid) return; grid.querySelectorAll('.prod-btn').forEach(decorate); }
  document.addEventListener('click', function(ev){
    var btn=ev.target.closest && ev.target.closest('.prod-btn');
    if(btn && btn.classList.contains('agotado') && !(ev.target.closest && ev.target.closest('.prod-eye'))){
      ev.stopPropagation(); ev.preventDefault();
      if(window.toast) window.toast('Art\u00edculo agotado');
    }
  }, true);
  function openPanel(){
    var prods=(window.CATALOG && CATALOG[state.sucursal])||[];
    var ago=getAgo();
    var rows=prods.map(function(p){ var on=!ago[p.id];
      return '<div class="avail-row"><div><div class="an">'+p.name+'</div><div class="as">'+p.sub+'</div></div><div class="avail-toggle'+(on?'':' off')+'" data-pid="'+p.id+'"></div></div>'; }).join('');
    var ov=document.createElement('div'); ov.className='avail-overlay';
    ov.innerHTML='<div class="avail-box"><div class="avail-head"><div class="t">Disponibilidad de art\u00edculos</div><button class="btn-ghost" id="availClose">Cerrar</button></div><div class="avail-body">'+rows+'</div><div class="avail-foot"><button class="btn-ghost" id="availAllOn">Activar todo</button></div></div>';
    document.body.appendChild(ov);
    ov.addEventListener('click', function(ev){
      if(ev.target===ov || ev.target.id==='availClose'){ ov.remove(); return; }
      var tg=ev.target.closest('.avail-toggle');
      if(tg){ toggle(tg.getAttribute('data-pid')); tg.classList.toggle('off'); }
      if(ev.target.id==='availAllOn'){ setAgo({}); applyGrid(); ov.querySelectorAll('.avail-toggle').forEach(function(t){ t.classList.remove('off'); }); }
    });
  }
  var mo=new MutationObserver(function(){ applyGrid(); });
  document.addEventListener('DOMContentLoaded', function(){
    var g=document.getElementById('prodGrid'); if(g) mo.observe(g,{childList:true}); applyGrid();
    try{
      var tb=document.querySelector('.topbar');
      var logout=tb && (tb.querySelector('.logout')||tb.querySelector('[class*=logout]'));
      if(tb && !document.getElementById('availBtn')){
        var b=document.createElement('button'); b.id='availBtn'; b.className='logout'; b.style.cursor='pointer';
        b.textContent='\u{1F441} Disponibilidad'; b.addEventListener('click', openPanel);
        if(logout) tb.insertBefore(b, logout); else tb.appendChild(b);
      }
    }catch(e){}
  });
})();

</script>
</body>
</html>
