<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Luna Smart POS &mdash; Sueno de Luna</title>
<style>
/* ============================================================
   LUNA SMART POS -- estilos (flujo inspirado en Parrot)
   ============================================================ */
:root{
  --cafe:#1c120a; --cafe-medio:#3d2010; --terracota:#b14618;
  --terracota-claro:#d0632f; --beige:#e8d6b9; --beige-claro:#f5ecdd;
  --verde-ok:#3f7d4e; --rojo:#c0392b; --gris:#8a7d6b; --linea:#e4dccb;
  --azul:#2f6f9e;
  --sombra:0 4px 18px rgba(28,18,10,.14);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{background:#faf6ef;color:var(--cafe);overflow:hidden;user-select:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select,textarea{font-family:inherit;font-size:16px;}
.hidden{display:none !important;}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--cafe);color:var(--beige);padding:14px 22px;border-radius:12px;font-size:15px;box-shadow:var(--sombra);opacity:0;pointer-events:none;transition:.25s;z-index:9999;max-width:90vw;text-align:center;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.screen{height:100vh;display:none;flex-direction:column;}
.screen.active{display:flex;}

/* ============ LOGIN PIN ============ */
#scLogin{background:linear-gradient(160deg,var(--cafe),var(--cafe-medio));align-items:center;justify-content:center;color:var(--beige);}
.login-box{width:100%;max-width:360px;text-align:center;padding:20px;}
.login-brand{font-size:30px;font-weight:800;letter-spacing:.5px;}
.login-brand span{color:var(--terracota-claro);}
.login-hi{font-size:20px;margin-top:22px;font-weight:600;}
.login-hint{font-size:14px;opacity:.8;margin-top:6px;line-height:1.4;}
.pin-display{margin:22px auto 10px;height:54px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid rgba(232,214,185,.25);display:flex;align-items:center;justify-content:center;gap:14px;}
.pin-dot{width:14px;height:14px;border-radius:50%;background:rgba(232,214,185,.3);}
.pin-dot.on{background:var(--terracota-claro);}
.login-suc select{width:100%;padding:12px;border-radius:12px;border:1px solid rgba(232,214,185,.3);background:rgba(255,255,255,.07);color:var(--beige);}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:6px;}
.key{height:64px;border-radius:14px;background:rgba(255,255,255,.08);font-size:24px;font-weight:700;color:var(--beige);display:flex;align-items:center;justify-content:center;transition:.12s;}
.key:active{background:var(--terracota);}
.key.enter{background:var(--terracota);}

/* ============ TOPBAR ============ */
.topbar{background:#fff;border-bottom:1px solid var(--linea);padding:0 14px;display:flex;align-items:center;gap:2px;flex-shrink:0;height:56px;}
.topbar .brand{font-weight:800;font-size:16px;color:var(--cafe);margin-right:8px;}
.topbar .brand span{color:var(--terracota);}
.nav-tab{padding:18px 12px;font-weight:600;font-size:15px;color:var(--gris);border-bottom:3px solid transparent;white-space:nowrap;}
.nav-tab.active{color:var(--terracota);border-bottom-color:var(--terracota);}
.nav-tab .badge{background:var(--terracota);color:#fff;border-radius:10px;font-size:12px;padding:1px 7px;margin-left:5px;}
.topbar .spacer{flex:1;}
.topbar .suc-pill{background:var(--beige-claro);color:var(--cafe-medio);padding:6px 12px;border-radius:20px;font-size:13px;font-weight:600;}
.topbar .logout{color:var(--gris);font-size:14px;padding:8px 10px;}

/* ============ TIPO DE ORDEN ============ */
#scTipoOrden .to-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;}
.to-title{font-size:24px;font-weight:700;color:var(--cafe-medio);}
.to-row{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;}
.to-card{width:200px;height:170px;border:1px solid var(--linea);border-radius:16px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-size:17px;font-weight:600;box-shadow:var(--sombra);transition:.12s;}
.to-card:active{transform:scale(.97);border-color:var(--terracota);}
.to-ic{font-size:42px;}

/* ============ POS ============ */
.pos-wrap{flex:1;display:flex;overflow:hidden;}
.pos-left{flex:1.7;display:flex;flex-direction:column;padding:14px;overflow:hidden;}
.pos-topline{display:flex;gap:12px;align-items:center;margin-bottom:12px;}
.pos-search{flex:1;padding:12px 16px;border:1px solid var(--linea);border-radius:12px;background:#fff;}
.lbl{font-size:12px;font-weight:700;color:var(--gris);letter-spacing:.5px;margin:4px 2px 8px;text-transform:uppercase;}
.chip-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;}
.chip{padding:11px 20px;border-radius:12px;background:#fff;border:1px solid var(--linea);font-weight:600;font-size:14px;color:var(--cafe-medio);white-space:nowrap;flex-shrink:0;}
.chip.active{background:var(--cafe-medio);color:var(--beige);border-color:var(--cafe-medio);}
.chip.sub.active{background:var(--terracota);border-color:var(--terracota);color:#fff;}
.prod-grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;align-content:start;padding-bottom:20px;}
.prod-btn{background:#fff;border:1px solid var(--linea);border-radius:14px;padding:16px 14px;min-height:96px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;transition:.12s;box-shadow:0 2px 6px rgba(28,18,10,.04);}
.prod-btn:active{transform:scale(.96);border-color:var(--terracota);}
.prod-btn .pn{font-weight:700;font-size:15px;line-height:1.25;}
.prod-btn .pp{font-weight:800;font-size:16px;color:var(--terracota);margin-top:10px;}

/* Carrito */
.pos-right{flex:1;max-width:390px;background:#fff;border-left:1px solid var(--linea);display:flex;flex-direction:column;}
.cart-head{padding:14px 16px;border-bottom:1px solid var(--linea);display:flex;justify-content:space-between;align-items:flex-start;}
.cart-head .t{font-weight:800;font-size:18px;}
.cart-head .st{font-size:13px;color:var(--gris);margin-top:2px;}
.cart-head .clear{font-size:13px;color:var(--rojo);font-weight:600;}
.cart-lines{flex:1;overflow-y:auto;padding:6px 14px;}
.cart-empty{color:var(--gris);text-align:center;padding:40px 20px;font-size:15px;}
.cart-line{display:flex;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px solid var(--beige-claro);}
.cart-line .info{flex:1;}
.cart-line .info .n{font-weight:600;font-size:14px;}
.cart-line .info .u{font-size:12px;color:var(--gris);}
.cart-line .info .note{font-size:12px;color:var(--azul);font-style:italic;margin-top:2px;}
.qty{display:flex;align-items:center;gap:8px;}
.qty button{width:32px;height:32px;border-radius:9px;background:var(--beige-claro);font-size:19px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.qty button:active{background:var(--terracota);color:#fff;}
.qty .q{min-width:20px;text-align:center;font-weight:700;}
.cart-line .sub{font-weight:700;min-width:60px;text-align:right;font-size:14px;}
/* barra de acciones Nota/Descuento/Separador */
.cart-actions{display:flex;gap:6px;padding:10px 14px;border-top:1px solid var(--linea);}
.cart-act{flex:1;padding:11px 4px;border-radius:10px;background:var(--beige-claro);font-weight:700;font-size:13px;color:var(--cafe-medio);display:flex;align-items:center;justify-content:center;gap:5px;}
.cart-act:active{background:var(--terracota);color:#fff;}
.cart-foot{border-top:1px solid var(--linea);padding:14px 16px;}
.row-line{display:flex;justify-content:space-between;font-size:14px;color:var(--gris);margin-bottom:6px;}
.row-line.desc{color:var(--rojo);}
.cart-total{display:flex;justify-content:space-between;font-size:22px;font-weight:800;margin:8px 0 14px;}
.cart-total .amt{color:var(--terracota);}
.btn-cobrar{width:100%;padding:17px;border-radius:13px;background:var(--terracota);color:#fff;font-size:18px;font-weight:800;box-shadow:var(--sombra);}
.btn-cobrar:disabled{background:var(--gris);opacity:.5;box-shadow:none;}

/* ============ MODAL generico ============ */
.modal-bg{position:fixed;inset:0;background:rgba(28,18,10,.55);z-index:500;display:flex;align-items:center;justify-content:center;padding:16px;}
.modal{background:#fff;border-radius:20px;box-shadow:var(--sombra);width:100%;max-width:460px;padding:24px;max-height:92vh;overflow-y:auto;}
.modal h2{font-size:20px;margin-bottom:4px;}
.modal-total{font-size:30px;font-weight:800;color:var(--terracota);margin-bottom:18px;}
.modal .field{margin-bottom:14px;}
.modal .field label{display:block;font-size:13px;font-weight:700;color:var(--cafe-medio);margin-bottom:6px;}
.modal .field input,.modal .field textarea,.modal .field select{width:100%;padding:13px;border:1px solid var(--linea);border-radius:12px;background:var(--beige-claro);}
.modal .field textarea{min-height:80px;resize:vertical;}
.seg{display:flex;gap:8px;margin-bottom:14px;}
.seg button{flex:1;padding:12px;border-radius:10px;border:1px solid var(--linea);background:#fff;font-weight:700;font-size:14px;}
.seg button.active{background:var(--cafe-medio);color:var(--beige);border-color:var(--cafe-medio);}
.pay-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.pay-btn{padding:16px 8px;border-radius:12px;border:1px solid var(--linea);background:#fff;font-weight:700;font-size:14px;color:var(--cafe-medio);}
.pay-btn.active{background:var(--cafe-medio);color:var(--beige);border-color:var(--cafe-medio);}
.cash-box input{width:100%;padding:15px;border:1px solid var(--linea);border-radius:12px;font-size:20px;font-weight:700;text-align:right;background:var(--beige-claro);}
.quick-cash{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.quick-cash button{flex:1;padding:10px;border-radius:10px;background:var(--beige-claro);font-weight:700;font-size:14px;min-width:64px;}
.change-row{display:flex;justify-content:space-between;font-size:18px;font-weight:700;margin:12px 0;}
.change-row .change{color:var(--verde-ok);}
.change-row .change.neg{color:var(--rojo);}
.modal-actions{display:flex;gap:10px;}
.btn-cancel{flex:1;padding:15px;border-radius:12px;background:var(--beige-claro);color:var(--cafe-medio);font-weight:700;}
.btn-confirm{flex:2;padding:15px;border-radius:12px;background:var(--verde-ok);color:#fff;font-weight:800;font-size:16px;}
.btn-confirm:disabled{opacity:.4;}

/* ============ PANELES (Mesas, Pedidos, Config, Caja) ============ */
.panel{flex:1;overflow-y:auto;padding:22px;width:100%;max-width:1000px;margin:0 auto;}
.panel h2{font-size:24px;margin-bottom:4px;}
.panel .sub{color:var(--gris);margin-bottom:20px;}
.card{background:#fff;border:1px solid var(--linea);border-radius:14px;padding:18px;box-shadow:var(--sombra);margin-bottom:16px;}
.card h3{font-size:16px;color:var(--cafe-medio);margin-bottom:12px;border-bottom:1px solid var(--linea);padding-bottom:8px;}
/* Mesas */
.mesa-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:14px;}
.mesa{border-radius:14px;padding:18px 12px;text-align:center;font-weight:700;border:2px solid;box-shadow:var(--sombra);transition:.12s;}
.mesa:active{transform:scale(.96);}
.mesa.libre{background:#eef6ef;border-color:var(--verde-ok);color:var(--verde-ok);}
.mesa.ocupada{background:#fbeeea;border-color:var(--terracota);color:var(--terracota);}
.mesa .mn{font-size:20px;}
.mesa .ms{font-size:12px;font-weight:600;margin-top:6px;}
.mesa .mt{font-size:13px;font-weight:800;margin-top:4px;}
/* Pedidos historial */
.ped-row{display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid var(--beige-claro);}
.ped-row .pid{font-weight:800;color:var(--terracota);min-width:70px;}
.ped-row .pinfo{flex:1;}
.ped-row .pinfo .pt{font-weight:600;}
.ped-row .pinfo .pm{font-size:13px;color:var(--gris);}
.ped-row .ptot{font-weight:800;}
.ped-row .pest{font-size:12px;padding:3px 10px;border-radius:12px;font-weight:700;}
.pest.pagado{background:#eef6ef;color:var(--verde-ok);}
.pest.abierto{background:#fdf3e7;color:var(--terracota);}
/* Config */
.cfg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;}
.cfg-card{background:#fff;border:1px solid var(--linea);border-radius:16px;padding:26px 16px;text-align:center;box-shadow:var(--sombra);transition:.12s;}
.cfg-card:active{transform:scale(.97);border-color:var(--terracota);}
.cfg-ic{font-size:38px;}
.cfg-t{font-weight:700;margin-top:12px;}
.cfg-badge{font-size:11px;padding:2px 8px;border-radius:10px;margin-top:8px;display:inline-block;font-weight:700;}
.cfg-badge.ok{background:#eef6ef;color:var(--verde-ok);}
.cfg-badge.err{background:#fbeeea;color:var(--rojo);}
/* Caja */
.pay-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.pay-summary .pill{background:var(--beige-claro);border-radius:12px;padding:14px;text-align:center;}
.pay-summary .pill .l{font-size:12px;color:var(--gris);}
.pay-summary .pill .v{font-size:18px;font-weight:800;}
.caja-info{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:8px;}
.caja-info div .l{font-size:12px;color:var(--gris);}
.caja-info div .v{font-size:18px;font-weight:800;}
.caja-ops{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;}
.caja-op{padding:16px;border-radius:12px;background:var(--beige-claro);font-weight:700;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;}
.caja-op:active{background:var(--terracota);color:#fff;}
.caja-op .ci{font-size:26px;}
.star-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--beige-claro);}
.grand{display:flex;justify-content:space-between;font-size:22px;font-weight:800;margin-top:10px;}
.grand .amt{color:var(--terracota);}
.caja-actions{display:flex;gap:12px;margin-top:4px;}
.btn-print{flex:1;padding:16px;border-radius:13px;background:var(--cafe-medio);color:var(--beige);font-weight:700;}
.btn-cerrar{flex:1;padding:16px;border-radius:13px;background:var(--terracota);color:#fff;font-weight:800;}

@media(max-width:860px){
  .pos-wrap{flex-direction:column;}
  .pos-left{flex:none;padding:12px;overflow:visible;}
  .pos-right{max-width:none;border-left:none;border-top:2px solid var(--linea);max-height:48vh;flex:none;}
  .prod-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));}
  .pay-summary{grid-template-columns:1fr 1fr;}
  .to-card{width:150px;height:150px;}
  .panel{padding:16px;}
  .cfg-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;}
  .kds-grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));}
}
@media(max-width:600px){
  .topbar{flex-wrap:nowrap;overflow-x:auto;height:auto;padding:6px 8px;gap:0;-webkit-overflow-scrolling:touch;}
  .topbar::-webkit-scrollbar{display:none;}
  .brand{font-size:14px;margin-right:4px;flex-shrink:0;}
  .nav-tab{padding:12px 10px;font-size:14px;flex-shrink:0;}
  .spacer{display:none;}
  .suc-pill{font-size:11px;padding:5px 9px;flex-shrink:0;}
  #tbUser{display:none;}
  .logout{flex-shrink:0;font-size:13px;}
  .pos-left{padding:8px;}
  .prod-grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;}
  .pos-right{max-height:52vh;}
  .pay-summary{grid-template-columns:1fr;}
  .to-card{width:44vw;max-width:200px;height:130px;}
  .scTipoOrden,#scTipoOrden{flex-direction:column;}
  .panel{padding:12px;}
  h2{font-size:1.2rem;}
  .cfg-grid{grid-template-columns:1fr 1fr;gap:10px;}
  .mesa-grid{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;}
  .kds-grid{grid-template-columns:1fr;}
  .cart-actions{flex-wrap:wrap;}
  .keypad{gap:10px;}
  .key{height:58px;font-size:22px;}
  .modal{width:94vw;max-width:none;padding:16px;}
  .det-list{max-height:44vh;}
}
@media print{ body *{visibility:hidden;} #printArea,#printArea *{visibility:visible;} #printArea{position:absolute;left:0;top:0;width:100%;padding:20px;} }

.det-list{margin:10px 0;max-height:320px;overflow:auto}.det-row{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid rgba(0,0,0,.08)}.det-q{font-weight:700;color:var(--terracota);min-width:34px}.det-n{flex:1}.det-note{font-size:.8rem;color:#8a7a68;font-style:italic;margin-top:2px}.det-p{font-weight:600;white-space:nowrap}.det-tot{display:flex;justify-content:space-between;padding:5px 0;font-size:.95rem}.det-grand{font-weight:800;font-size:1.15rem;border-top:2px solid var(--cafe-medio);margin-top:6px;padding-top:10px}
/* ===== KDS / Monitor de estacion ===== */.kds-filter{display:flex;gap:8px;margin:10px 0 16px;flex-wrap:wrap}.kds-f{padding:9px 18px;border-radius:20px;background:var(--beige-claro);color:var(--cafe-medio);font-weight:600;font-size:14px;border:1px solid var(--linea)}.kds-f.on{background:var(--terracota);color:#fff;border-color:var(--terracota)}.kds-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}.kds-card{background:#fff;border:1px solid var(--linea);border-radius:14px;padding:14px;border-top:5px solid var(--gris)}.kds-card.barra{border-top-color:#2f6f9e}.kds-card.cocina{border-top-color:var(--terracota)}.kdc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}.kdc-folio{font-weight:800;font-size:1.15rem;color:var(--cafe)}.kdc-area{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:3px 9px;border-radius:10px;background:var(--beige-claro);color:var(--cafe-medio)}.kdc-meta{font-size:.82rem;color:var(--gris);margin-bottom:10px}.kdc-item{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid rgba(0,0,0,.06)}.kdc-q{font-weight:800;color:var(--terracota);min-width:30px}.kdc-n{flex:1;font-weight:600}.kdc-note{font-size:.78rem;color:#8a7a68;font-style:italic;font-weight:400}.kdc-btn{margin-top:12px;width:100%;padding:12px;border-radius:10px;background:var(--verde-ok);color:#fff;font-weight:700;font-size:15px}
/* --- descripcion en tiles --- */
.prod-btn{ display:flex; flex-direction:column; align-items:flex-start; gap:2px; }
.prod-btn .pd{ font-size:11px; color:#7a6650; line-height:1.2; margin:2px 0; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.prod-btn .pmods{ font-size:10px; color:var(--terracota); font-weight:600; }
.cart-line .cmods{ font-size:11px; color:var(--terracota); margin-top:2px; }
.kdc-mods{ font-size:12px; color:#b14618; font-weight:600; margin-top:2px; }
/* --- modal de modificadores --- */
.mods-backdrop{ position:fixed; inset:0; background:rgba(28,18,10,.55); display:none; align-items:flex-end; justify-content:center; z-index:9000; }
.mods-backdrop.show{ display:flex; }
.mods-box{ background:#fff; width:100%; max-width:520px; max-height:88vh; border-radius:18px 18px 0 0; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 -8px 30px rgba(0,0,0,.3); }
@media(min-width:600px){ .mods-backdrop{ align-items:center; } .mods-box{ border-radius:18px; } }
.mods-head{ padding:18px 20px 12px; background:var(--cafe); color:var(--beige); }
.mods-head .mh-t{ font-size:19px; font-weight:700; }
.mods-head .mh-d{ font-size:13px; opacity:.85; margin-top:4px; }
.mods-body{ padding:8px 20px; overflow-y:auto; flex:1; }
.mgroup{ padding:12px 0; border-bottom:1px solid #eee; }
.mg-l{ font-weight:700; color:var(--cafe-medio); margin-bottom:8px; display:flex; align-items:center; gap:8px; }
.mg-l .req{ font-size:10px; background:var(--terracota); color:#fff; padding:2px 7px; border-radius:10px; font-weight:600; }
.mg-l .opc{ font-size:10px; background:#e8d6b9; color:var(--cafe-medio); padding:2px 7px; border-radius:10px; font-weight:600; }

function initLogin(){
  var sel=document.getElementById('loginSucursal');
  sel.innerHTML=SUCURSALES.map(function(s){return '<option value="'+s.id+'">'+esc(s.nombre)+'</option>';}).join('');
  document.getElementById('keypad').querySelectorAll('.key').forEach(function(k){ k.addEventListener('click',function(){ pinKey(k.dataset.k); }); });
  renderPinDisplay();
}
function pinKey(k){
  if(k==='del'){ state.pin=state.pin.slice(0,-1); }
  else if(k==='enter'){ doLogin(); return; }
  else if(state.pin.length<6){ state.pin+=k; }
  renderPinDisplay();
}
function renderPinDisplay(){
  var d=document.getElementById('pinDisplay'), dots=state.pin.length, html='';
  for(var i=0;i<Math.max(4,dots);i++){ html+='<span class="pin-dot'+(i<dots?' on':'')+'"></span>'; }
  d.innerHTML=html;
}
function doLogin(){
  var suc=document.getElementById('loginSucursal').value;
  if(state.pin.length<4){ showToast('Ingresa tu PIN (min. 4 digitos)'); return; }
  API.login(state.pin,suc).then(function(u){
    if(!u){ showToast('PIN incorrecto'); state.pin=''; renderPinDisplay(); return; }
    var s=SUCURSALES.filter(function(x){return x.id===suc;})[0];
    state.logged=true; state.sucursal=suc; state.role=u.rol; state.user=u.nombre;
    state.view='menu'; state.tipoOrden=null; state.mesa=null; state.cart=[]; state.descuento={tipo:null,valor:0}; state.turnoSales=[]; state.pin='';
    state.pedidos=seedPedidos();
    showScreen('scApp'); renderTopbar(); goMenu();
    showToast('Bienvenido '+u.nombre+' -- '+s.nombre);
  });
}

/* ============ CATALOGO 2 NIVELES ============ */
function menusOf(prods){ var s=[]; var hasFav=false; prods.forEach(function(p){ if(p.fav===true)hasFav=true; if(s.indexOf(p.menu)<0) s.push(p.menu); }); if(hasFav) s.unshift('Favoritos'); return s; }
function subsOf(prods,menu){ var s=['Todos']; prods.forEach(function(p){ if(p.menu===menu && s.indexOf(p.sub)<0) s.push(p.sub); }); return s; }
function currentProducts(){
  var prods=CATALOG[state.sucursal]||[];
  var isFav=(state.menu==='Favoritos');
  return prods.filter(function(p){
    var okMenu=isFav?(p.fav===true):(p.menu===state.menu);
    var okSub=isFav?true:(!state.sub||p.sub===state.sub);
    var okSearch=!state.search||(p.name.toLowerCase().indexOf(state.search.toLowerCase())>=0);
    return okMenu&&okSub&&okSearch;
  });
}
function selectMenu(m){ state.menu=m; state.sub=null; renderPos(); }
function selectSub(s){ state.sub=s; renderPos(); }
function addToCart(p){
  var l=state.cart.filter(function(x){return x.id===p.id&&!x.note;})[0];
  if(l){ l.qty++; } else { state.cart.push({uid:Date.now()+Math.random(),id:p.id,name:p.name,price:p.price,qty:1,note:'',area:areaDe(p)}); }
  renderTopbar(); renderCart();
}

var _modP=null, _modSize=null, _modSel={};
function openMods(p){
  _modP=p; _modSel={}; _modSize=null;
  if(p.sized && p.prices){ _modSize=Object.keys(p.prices)[0]; }
  (p.mods||[]).forEach(function(g,gi){
    if(g.req && g.opts && g.opts.length){ _modSel[gi]= (g.type==='multi')? [0] : 0; }
    else { _modSel[gi]= (g.type==='multi')? [] : -1; }
  });
  renderMods();
  document.getElementById('modsBackdrop').classList.add('show');
}
function closeMods(){ document.getElementById('modsBackdrop').classList.remove('show'); _modP=null; }
function modsTotal(){
  var p=_modP; if(!p) return 0;
  var base = (p.sized && p.prices && _modSize!=null)? p.prices[_modSize] : p.price;
  var extra=0;
  (p.mods||[]).forEach(function(g,gi){
    var sel=_modSel[gi];
    if(g.type==='multi'){ (sel||[]).forEach(function(oi){ extra+= (g.opts[oi]&&g.opts[oi].p)||0; }); }
    else if(sel>-1 && g.opts[sel]){ extra+= g.opts[sel].p||0; }
  });
  return base+extra;
}
function renderMods(){
  var p=_modP; if(!p) return;
  var h='<div class="mods-head"><div class="mh-t">'+esc(p.name)+'</div>'+(p.desc?'<div class="mh-d">'+esc(p.desc)+'</div>':'')+'</div>';
  h+='<div class="mods-body">';
  if(p.sized && p.prices){
    h+='<div class="mgroup"><div class="mg-l">Tama&ntilde;o<span class="req">Requerido</span></div>';
    Object.keys(p.prices).forEach(function(sn){
      h+='<label class="mopt"><span><input type="radio" name="msize" data-sz="'+esc(sn)+'"'+(_modSize===sn?' checked':'')+'> '+esc(sn)+'</span><span class="op">'+money(p.prices[sn])+'</span></label>';
    });
    h+='</div>';
  }
  (p.mods||[]).forEach(function(g,gi){
    h+='<div class="mgroup"><div class="mg-l">'+esc(g.label)+(g.req?'<span class="req">Requerido</span>':'<span class="opc">Opcional</span>')+'</div>';
    (g.opts||[]).forEach(function(o,oi){
      var checked;
      if(g.type==='multi'){ checked=(_modSel[gi]||[]).indexOf(oi)>-1; }
      else { checked=_modSel[gi]===oi; }
      var inp = g.type==='multi'?'checkbox':'radio';
      var extra = o.p? '<span class="op">+'+money(o.p)+'</span>':'';
      h+='<label class="mopt"><span><input type="'+inp+'" name="mg'+gi+'" data-gi="'+gi+'" data-oi="'+oi+'"'+(checked?' checked':'')+'> '+esc(o.l)+'</span>'+extra+'</label>';
    });
    h+='</div>';
  });
  h+='</div>';
  h+='<div class="mods-foot"><button class="btn-ghost" id="modsCancel">Cancelar</button><button class="btn-primary" id="modsAdd">Agregar &middot; <span id="modsTot">'+money(modsTotal())+'</span></button></div>';
  var box=document.getElementById('modsBox'); box.innerHTML=h;
  box.querySelectorAll('input[name="msize"]').forEach(function(r){ r.addEventListener('change',function(){ _modSize=r.dataset.sz; document.getElementById('modsTot').textContent=money(modsTotal()); }); });
  (p.mods||[]).forEach(function(g,gi){
    box.querySelectorAll('input[name="mg'+gi+'"]').forEach(function(inp){
      inp.addEventListener('change',function(){
        var oi=parseInt(inp.dataset.oi,10);
        if(g.type==='multi'){ var a=_modSel[gi]||[]; var k=a.indexOf(oi); if(inp.checked){ if(k<0)a.push(oi);} else { if(k>-1)a.splice(k,1);} _modSel[gi]=a; }
        else { _modSel[gi]=oi; }
        document.getElementById('modsTot').textContent=money(modsTotal());
      });
    });
  });
  document.getElementById('modsCancel').addEventListener('click',closeMods);
  document.getElementById('modsAdd').addEventListener('click',confirmMods);
}
function confirmMods(){
  var p=_modP; if(!p) return;
  var parts=[]; if(_modSize) parts.push(_modSize);
  var missing=false;
  (p.mods||[]).forEach(function(g,gi){
    var sel=_modSel[gi];
    if(g.type==='multi'){ (sel||[]).forEach(function(oi){ if(g.opts[oi]) parts.push(g.opts[oi].l); }); if(g.req && (!sel||!sel.length)) missing=true; }
    else { if(sel>-1 && g.opts[sel]) parts.push(g.opts[sel].l); else if(g.req) missing=true; }
  });
  if(missing){ alert('Selecciona las opciones requeridas'); return; }
  var price=modsTotal();
  var label=parts.join(' \u00b7 ');
  state.cart.push({uid:Date.now()+Math.random(),id:p.id,name:p.name,price:price,qty:1,note:'',mods:label,area:areaDe(p)});
  renderTopbar(); renderCart(); closeMods();
}
function changeQty(uid,d){
  var l=state.cart.filter(function(x){return x.uid==uid;})[0]; if(!l) return; l.qty+=d;
  if(l.qty<=0){ state.cart=state.cart.filter(function(x){return x.uid!=uid;}); }
  renderCart();
}
function clearCart(){ state.cart=[]; state.descuento={tipo:null,valor:0}; renderTopbar(); renderCart(); }
function cartSubtotal(){ return state.cart.reduce(function(s,l){return s+l.price*l.qty;},0); }
function cartDescuentoMonto(){
  var sub=cartSubtotal();
  if(state.descuento.tipo==='porcentaje'){ return sub*(state.descuento.valor/100); }
  if(state.descuento.tipo==='monto'){ return Math.min(state.descuento.valor,sub); }
  return 0;
}
function renderPos(){
  var prods=CATALOG[state.sucursal]||[]; var menus=menusOf(prods);
  if(!state.menu&&menus.length) state.menu=menus[0];
  var mc=document.getElementById('menuChips');
  mc.innerHTML=menus.map(function(m){return '<button class="chip'+(m===state.menu?' active':'')+'" data-m="'+esc(m)+'">'+esc(m)+'</button>';}).join('');
  mc.querySelectorAll('.chip').forEach(function(b){ b.addEventListener('click',function(){ selectMenu(b.dataset.m); }); });
  var subs=subsOf(prods,state.menu);
  var sc=document.getElementById('subChips');
  sc.innerHTML=subs.map(function(s){return '<button class="chip sub'+((state.sub===s||(!state.sub&&s==='Todos'))?' active':'')+'" data-s="'+esc(s)+'">'+esc(s)+'</button>';}).join('');
  sc.querySelectorAll('.chip').forEach(function(b){ b.addEventListener('click',function(){ selectSub(b.dataset.s); }); });
  renderProducts(); renderCart();
  var tipoTxt = state.mesa? ('Mesa '+state.mesa) : (state.tipoOrden?TIPO_LABEL[state.tipoOrden]:'');
  document.getElementById('cartTipo').textContent=tipoTxt;
}
function renderProducts(){
  var grid=document.getElementById('prodGrid'); var prods=currentProducts();
  if(!prods.length){ grid.innerHTML='<div class="cart-empty">Sin art&iacute;culos</div>'; return; }
  grid.innerHTML=prods.map(function(p){
    var d = p.desc ? '<span class="pd">'+esc(p.desc)+'</span>' : '';
    var pr = (p.sized && p.prices) ? ('desde '+money(p.price)) : money(p.price);
    var badge = (p.mods&&p.mods.length)||p.sized ? '<span class="pmods">+ opciones</span>' : '';
    return '<button class="prod-btn" data-id="'+p.id+'"><span class="pn">'+esc(p.name)+'</span>'+d+'<span class="pp">'+pr+'</span>'+badge+'</button>';
  }).join('');
  grid.querySelectorAll('.prod-btn').forEach(function(b){ b.addEventListener('click',function(){ var p=(CATALOG[state.sucursal]||[]).filter(function(x){return x.id===b.dataset.id;})[0]; if(!p) return; if((p.mods&&p.mods.length)||p.sized){ openMods(p); } else { addToCart(p); } }); });
}
function renderCart(){
  var host=document.getElementById('cartLines');
  if(!state.cart.length){ host.innerHTML='<div class="cart-empty">Toca un art&iacute;culo para agregarlo</div>'; }
  else{
    host.innerHTML=state.cart.map(function(l){
      return '<div class="cart-line"><div class="info"><div class="n">'+esc(l.name)+'</div><div class="u">'+money(l.price)+' c/u</div>'+
        (l.mods?'<div class="cmods">'+esc(l.mods)+'</div>':'')+
        (l.note?'<div class="note">&#9998; '+esc(l.note)+'</div>':'')+'</div>'+
        '<div class="qty"><button data-uid="'+l.uid+'" data-d="-1">&minus;</button><span class="q">'+l.qty+'</span><button data-uid="'+l.uid+'" data-d="1">&plus;</button></div>'+
        '<div class="sub">'+money(l.price*l.qty)+'</div></div>';
    }).join('');
    host.querySelectorAll('.qty button').forEach(function(b){ b.addEventListener('click',function(){ changeQty(b.dataset.uid, parseInt(b.dataset.d,10)); }); });
  }
  var sub=cartSubtotal(); var desc=cartDescuentoMonto(); var base=sub-desc; var iva=base*CONFIG.IVA_RATE;
  document.getElementById('cartSubtotal').textContent=money(sub);
  var dr=document.getElementById('cartDescRow');
  if(desc>0){ dr.classList.remove('hidden'); document.getElementById('cartDescLbl').textContent='Descuento'+(state.descuento.tipo==='porcentaje'?' ('+state.descuento.valor+'%)':''); document.getElementById('cartDescVal').textContent='-'+money(desc); }
  else{ dr.classList.add('hidden'); }
  document.getElementById('cartIva').textContent=money(iva);
  document.getElementById('cartTotal').textContent=money(base+iva);
  document.getElementById('btnCobrar').disabled=!state.cart.length;
}
function cartTotalFinal(){ var base=cartSubtotal()-cartDescuentoMonto(); return base+base*CONFIG.IVA_RATE; }

function bindModal(onOk){
  document.getElementById('mCancel').addEventListener('click',closeModal);
  document.getElementById('mOk').addEventListener('click',onOk);
  document.getElementById('mbg').addEventListener('click',function(e){ if(e.target.id==='mbg') closeModal(); });
}

/* ============ COBRO ============ */
function openCheckout(){ if(!state.cart.length){ showToast('La orden esta vacia'); return; } state.checkoutOpen=true; state.metodoPago='efectivo'; state.cashReceived=0; renderCheckout(); }
function closeCheckout(){ state.checkoutOpen=false; closeModal(); }
function setPaymentMethod(m){ state.metodoPago=m; renderCheckout(); }
function setCash(v){ state.cashReceived=parseFloat(v)||0; renderCheckout(); }
function renderCheckout(){
  if(!state.checkoutOpen){ closeModal(); return; }
  var total=cartTotalFinal(); var change=state.cashReceived-total;
  var metodos=['efectivo','tarjeta','transferencia','rappi'];
  var cashBlock = state.metodoPago==='efectivo' ?
    '<div class="cash-box"><input id="cashInput" type="number" inputmode="decimal" placeholder="Monto recibido" value="'+(state.cashReceived||'')+'">'+
    '<div class="quick-cash">'+[100,200,500,1000].map(function(v){return '<button data-cash="'+v+'">$'+v+'</button>';}).join('')+'<button data-cash="exact">Exacto</button></div>'+
    '<div class="change-row"><span>Cambio</span><span class="change'+(change<0?" neg":"")+'">'+money(change>0?change:0)+'</span></div></div>' : '';
  var confDis=(state.metodoPago==='efectivo'&&state.cashReceived<total)?'disabled':'';
  document.getElementById('modalHost').innerHTML='<div class="modal-bg" id="mbg"><div class="modal"><h2>Cobrar</h2><div class="modal-total">'+money(total)+'</div>'+
    '<div class="pay-grid">'+metodos.map(function(m){return '<button class="pay-btn'+(state.metodoPago===m?" active":"")+'" data-m="'+m+'">'+esc(PAGO_LABEL[m])+'</button>';}).join('')+'</div>'+cashBlock+
    '<div class="modal-actions"><button class="btn-cancel" id="btnCancelPay">Cancelar</button><button class="btn-confirm" id="btnConfirmPay" '+confDis+'>Confirmar cobro</button></div></div></div>';
  document.querySelectorAll('.pay-btn').forEach(function(b){ b.addEventListener('click',function(){ setPaymentMethod(b.dataset.m); }); });
  var ci=document.getElementById('cashInput'); if(ci){ ci.addEventListener('input',function(){ setCash(ci.value); }); ci.focus(); }
  document.querySelectorAll('[data-cash]').forEach(function(b){ b.addEventListener('click',function(){ setCash(b.dataset.cash==='exact'?total:b.dataset.cash); }); });
  document.getElementById('btnCancelPay').addEventListener('click',closeCheckout);
  document.getElementById('btnConfirmPay').addEventListener('click',confirmSale);
  document.getElementById('mbg').addEventListener('click',function(e){ if(e.target.id==='mbg') closeCheckout(); });
}
function confirmSale(){
  var total=cartTotalFinal();
  if(state.metodoPago==='efectivo'&&state.cashReceived<total){ showToast('Monto insuficiente'); return; }
  var suc=SUCURSALES.filter(function(s){return s.id===state.sucursal;})[0];
  var items=state.cart.map(function(l){ var st=l.price*l.qty; return {articulo:l.name,cantidad:l.qty,precio_unit:l.price,subtotal:st,nota:l.note}; });
  API.registrarVenta({items:items,metodoPago:state.metodoPago,tipoOrden:state.tipoOrden,mesa:state.mesa,descuento:state.descuento,sucursal:state.sucursal}).then(function(){ procesarInventario(state.cart.slice(),suc); });
  state.turnoSales.push({ts:Date.now(),metodo:state.metodoPago,total:total,items:state.cart.slice()});
  var nid='#'+(1044+state.turnoSales.length+1);
  state.pedidos.unshift({id:nid,tipo:state.mesa?'aqui':state.tipoOrden,metodo:state.metodoPago,total:total,estado:'pagado',hora:new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'}),mesa:state.mesa,descuento:{tipo:state.descuento.tipo,valor:state.descuento.valor},items:state.cart.map(function(l){return {name:l.name,qty:l.qty,price:l.price,note:l.note,area:l.area||'barra'};}),estadoBarra:'pendiente',estadoCocina:'pendiente'});
  var change=state.metodoPago==='efectivo'?(state.cashReceived-total):0;
  state.checkoutOpen=false; state.cart=[]; state.descuento={tipo:null,valor:0}; state.mesa=null;
  renderTopbar(); renderCart(); closeModal();
  showToast(change>0?('Venta lista -- Cambio '+money(change)):('Venta registrada '+money(total)));
}
function procesarInventario(lines,suc){
  lines.forEach(function(l){ API.getRecetaProducto(l.name).then(function(r){
    if(!r){ showToast('Aviso: "'+l.name+'" sin receta, no se descuenta'); return; }
    var ings=r.map(function(x){return {name:x.name,usado:x.qty*l.qty};});
    API.descontarInventario(ings,suc?suc.inventario:null).then(function(res){ if(res.alertas&&res.alertas.length){ res.alertas.forEach(function(a){ showToast('Reponer urgente: '+a); }); } });
  }); });
}

/* ============ MESAS ============ */
function renderMesas(){
  var mesas=MESAS_MOCK[state.sucursal]||[];
  var html='<h2>Mapa de mesas</h2><div class="sub">Toca una mesa para tomar o continuar su orden</div><div class="mesa-grid">';
  html+=mesas.map(function(m){ return '<button class="mesa '+m.estado+'" data-n="'+m.n+'"><div class="mn">Mesa '+m.n+'</div><div class="ms">'+(m.estado==='libre'?'Disponible':'Ocupada')+'</div>'+(m.total?'<div class="mt">'+money(m.total)+'</div>':'')+'</button>'; }).join('');
  html+='</div>';
  document.getElementById('mesasContent').innerHTML=html;
  document.querySelectorAll('#mesasContent .mesa').forEach(function(b){ b.addEventListener('click',function(){ selectMesa(parseInt(b.dataset.n,10)); }); });
}
function kdsSetArea(a){ state.kdsArea=a; renderKds(); }
function kdsMarcarListo(ix,area){
  var p=state.pedidos[ix]; if(!p) return;
  if(area==='cocina') p.estadoCocina='listo'; else p.estadoBarra='listo';
  showToast('Comanda '+p.id+' ('+(AREA_LABEL[area]||area)+') marcada como lista');
  renderTopbar(); renderKds();
}
function renderKds(){
  var area=state.kdsArea||'todas';
  var tabs='<div class="kds-filter">'+
    ['todas','barra','cocina'].map(function(a){ return '<button class="kds-f'+(area===a?' on':'')+'" onclick="kdsSetArea(\''+a+'\')">'+(a==='todas'?'Todas':AREA_LABEL[a])+'</button>'; }).join('')+'</div>';
  var pedidosAbiertos=state.pedidos.filter(function(p){ return (p.estadoBarra&&p.estadoBarra!=='listo')||(p.estadoCocina&&p.estadoCocina!=='listo'); });
  var cards='';
  pedidosAbiertos.forEach(function(p){
    var ix=state.pedidos.indexOf(p);
    ['barra','cocina'].forEach(function(ar){
      if(area!=='todas'&&area!==ar) return;
      var estado=ar==='cocina'?p.estadoCocina:p.estadoBarra;
      if(!estado||estado==='listo') return;
      var its=(p.items||[]).filter(function(l){return (l.area||'barra')===ar;});
      if(!its.length) return;
      var rows=its.map(function(l){ return '<div class="kdc-item"><span class="kdc-q">'+l.qty+'x</span><span class="kdc-n">'+esc(l.name)+(l.mods?'<div class="kdc-mods">'+esc(l.mods)+'</div>':'')+(l.note?'<div class="kdc-note">'+esc(l.note)+'</div>':'')+'</span></div>'; }).join('');
      cards+='<div class="kds-card '+ar+'"><div class="kdc-top"><span class="kdc-folio">'+esc(p.id)+'</span><span class="kdc-area">'+AREA_LABEL[ar]+'</span></div><div class="kdc-meta">'+esc(TIPO_LABEL[p.tipo]||p.tipo)+(p.mesa?' &middot; Mesa '+esc(p.mesa):'')+' &middot; '+esc(p.hora)+'</div>'+rows+'<button class="kdc-btn" onclick="kdsMarcarListo('+ix+',\''+ar+'\')">Marcar listo</button></div>';
    });
  });
  if(!cards) cards='<div class="cart-empty">Sin comandas pendientes</div>';
  var html='<h2>Monitor de estaci&oacute;n</h2><div class="sub">Comandas por elaborar (sustituye la impresi&oacute;n de tickets)</div>'+tabs+'<div class="kds-grid">'+cards+'</div>';
  document.getElementById('kdsContent').innerHTML=html;
}
function selectMesa(n){
  state.mesa=n; state.tipoOrden='aqui'; state.view='menu';
  var prods=CATALOG[state.sucursal]||[]; state.menu=menusOf(prods)[0]; state.sub=null;
  renderTopbar(); showAppView('pos'); renderPos(); showToast('Mesa '+n+' seleccionada');
}

/* ============ PEDIDOS (historial) ============ */
function renderPedidos(){
  var html='<h2>Historial de pedidos</h2><div class="sub">Toca un pedido para ver el detalle</div><div class="card">';
  if(!state.pedidos.length){ html+='<div class="cart-empty">Sin pedidos</div>'; }
  else{ html+=state.pedidos.map(function(p,ix){ return '<div class="ped-row" style="cursor:pointer;" onclick="verPedido('+ix+')"><div class="pid">'+esc(p.id)+'</div><div class="pinfo"><div class="pt">'+esc(TIPO_LABEL[p.tipo]||p.tipo)+(p.mesa?' &middot; Mesa '+esc(p.mesa):'')+'</div><div class="pm">'+esc(PAGO_LABEL[p.metodo]||p.metodo)+' &middot; '+esc(p.hora)+'</div></div><div class="ptot">'+money(p.total)+'</div><span class="pest '+p.estado+'">'+esc(p.estado)+'</span></div>'; }).join(''); }
  html+='</div>';
  document.getElementById('pedidosContent').innerHTML=html;
}
function verPedido(ix){
  var p=state.pedidos[ix]; if(!p) return;
  var items=(p.items||[]);
  var subtotal=items.reduce(function(a,l){return a+l.price*l.qty;},0);
  var desc=0; if(p.descuento&&p.descuento.tipo){ desc=p.descuento.tipo==='pct'? subtotal*(p.descuento.valor/100) : p.descuento.valor; }
  var rows=items.length? items.map(function(l){ return '<div class="det-row"><div class="det-q">'+l.qty+'x</div><div class="det-n">'+esc(l.name)+(l.note?'<div class="det-note">'+esc(l.note)+'</div>':'')+'</div><div class="det-p">'+money(l.price*l.qty)+'</div></div>'; }).join('') : '<div class="cart-empty">Sin artículos registrados</div>';
  document.getElementById('modalHost').innerHTML='<div class="modal-bg" id="mbg"><div class="modal"><h2>Pedido '+esc(p.id)+'</h2>'+
    '<div class="sub">'+esc(TIPO_LABEL[p.tipo]||p.tipo)+(p.mesa?' &middot; Mesa '+esc(p.mesa):'')+' &middot; '+esc(PAGO_LABEL[p.metodo]||p.metodo)+' &middot; '+esc(p.hora)+'</div>'+
    '<div class="det-list">'+rows+'</div>'+
    '<div class="det-tot"><span>Subtotal</span><span>'+money(subtotal)+'</span></div>'+
    (desc>0?'<div class="det-tot"><span>Descuento</span><span>-'+money(desc)+'</span></div>':'')+
    '<div class="det-tot det-grand"><span>Total</span><span>'+money(p.total)+'</span></div>'+
    '<div class="modal-actions"><button class="btn-cancel" id="mCancel">Cerrar</button><button class="btn-confirm" id="mOk">Reimprimir ticket</button></div></div></div>';
  bindModal(function(){ showToast('Reimprimiendo ticket '+p.id+'...'); closeModal(); });
}

/* ============ CONFIGURACION ============ */
function renderConfig(){
  var html='<h2>Configuraci&oacute;n</h2><div class="sub">Impresoras, alarmas, lector de huella y m&aacute;s</div><div class="cfg-grid">';
  html+=CONFIG_ITEMS.map(function(c){ return '<button class="cfg-card" data-t="'+esc(c.t)+'"><div class="cfg-ic">'+c.ic+'</div><div class="cfg-t">'+esc(c.t)+'</div>'+(c.badge?'<div class="cfg-badge '+c.badgeClass+'">'+esc(c.badge)+'</div>':'')+'</button>'; }).join('');
  html+='</div>';
  document.getElementById('configContent').innerHTML=html;
  document.querySelectorAll('#configContent .cfg-card').forEach(function(b){ b.addEventListener('click',function(){ showToast(b.dataset.t+' -- pendiente de configurar'); }); });
}

/* ============ CAJA / CORTE ============ */
function totalesPorMetodo(){ var t={efectivo:0,tarjeta:0,transferencia:0,rappi:0}; state.turnoSales.forEach(function(v){ t[v.metodo]=(t[v.metodo]||0)+v.total; }); return t; }
function productosEstrella(){ var m={}; state.turnoSales.forEach(function(v){ v.items.forEach(function(it){ m[it.name]=(m[it.name]||0)+it.qty; }); }); return Object.keys(m).map(function(k){return {name:k,qty:m[k]};}).sort(function(a,b){return b.qty-a.qty;}).slice(0,8); }
function renderCaja(){
  var t=totalesPorMetodo(); var total=t.efectivo+t.tarjeta+t.transferencia+t.rappi;
  var est=productosEstrella(); var suc=SUCURSALES.filter(function(s){return s.id===state.sucursal;})[0];
  var efectivoEnCaja=state.cajaInicial+t.efectivo;
  document.getElementById('cajaContent').innerHTML=
    '<div id="printArea"><h2>Caja &mdash; '+esc(suc?suc.nombre:'')+'</h2><div class="sub">'+(state.cajaAbierta?'Caja abierta':'Caja cerrada')+' &middot; '+state.turnoSales.length+' ventas en el turno</div>'+
    '<div class="card"><h3>Estado de caja</h3><div class="caja-info"><div><div class="l">Efectivo inicial</div><div class="v">'+money(state.cajaInicial)+'</div></div><div><div class="l">Efectivo esperado</div><div class="v">'+money(efectivoEnCaja)+'</div></div></div>'+
      '<div class="caja-ops"><button class="caja-op" data-op="corte"><span class="ci">&#128203;</span>Corte de caja</button><button class="caja-op" data-op="deposito"><span class="ci">&#11015;</span>Depositar</button><button class="caja-op" data-op="retiro"><span class="ci">&#11014;</span>Retirar</button><button class="caja-op" data-op="cajon"><span class="ci">&#128230;</span>Abrir caj&oacute;n</button></div></div>'+
    '<div class="card"><h3>Desglose por metodo de pago</h3><div class="pay-summary">'+
      '<div class="pill"><div class="l">Efectivo</div><div class="v">'+money(t.efectivo)+'</div></div>'+
      '<div class="pill"><div class="l">Tarjeta</div><div class="v">'+money(t.tarjeta)+'</div></div>'+
      '<div class="pill"><div class="l">Transferencia</div><div class="v">'+money(t.transferencia)+'</div></div>'+
      '<div class="pill"><div class="l">Rappi/Uber</div><div class="v">'+money(t.rappi)+'</div></div>'+
    '</div><div class="grand"><span>Venta total</span><span class="amt">'+money(total)+'</span></div></div>'+
    '<div class="card"><h3>Art&iacute;culos estrella del turno</h3>'+(est.length?est.map(function(e){return '<div class="star-row"><span>'+esc(e.name)+'</span><b>'+e.qty+'</b></div>';}).join(''):'<div class="cart-empty">A&uacute;n no hay ventas</div>')+'</div></div>'+
    '<div class="caja-actions"><button class="btn-print" id="btnPrint">Imprimir / PDF</button><button class="btn-cerrar" id="btnCerrarTurno">Cerrar turno (cierre de d&iacute;a)</button></div>';
  document.querySelectorAll('#cajaContent .caja-op').forEach(function(b){ b.addEventListener('click',function(){ cajaOp(b.dataset.op); }); });
  document.getElementById('btnPrint').addEventListener('click',function(){ window.print(); });
  document.getElementById('btnCerrarTurno').addEventListener('click',closeTurno);
}
function cajaOp(op){
  if(op==='cajon'){ showToast('Abriendo caj&oacute;n...'); return; }
  if(op==='corte'){ switchView('caja'); showToast('Corte parcial (usa Cerrar turno para el cierre de dia)'); return; }
  var titulo=op==='deposito'?'Depositar a caja':'Retirar de caja';
  document.getElementById('modalHost').innerHTML='<div class="modal-bg" id="mbg"><div class="modal"><h2>'+titulo+'</h2>'+
    '<div class="field"><label>Monto</label><input id="opMonto" type="number" inputmode="decimal" placeholder="0.00"></div>'+
    '<div class="field"><label>Motivo</label><input id="opMotivo" placeholder="Ej. pago proveedor, fondo..."></div>'+
    '<div class="modal-actions"><button class="btn-cancel" id="mCancel">Cancelar</button><button class="btn-confirm" id="mOk">Confirmar</button></div></div></div>';
  bindModal(function(){ var m=parseFloat(document.getElementById('opMonto').value)||0; if(m<=0){ showToast('Monto invalido'); return; } if(op==='retiro'){ state.cajaInicial-=m; } else { state.cajaInicial+=m; } closeModal(); renderCaja(); showToast(titulo+': '+money(m)); });
}
function closeTurno(){
  if(!state.turnoSales.length){ showToast('No hay ventas que cerrar'); return; }
  var t=totalesPorMetodo(); var total=t.efectivo+t.tarjeta+t.transferencia+t.rappi;
  var suc=SUCURSALES.filter(function(s){return s.id===state.sucursal;})[0];
  API.cerrarTurno({sucursal:suc?suc.nombre:state.sucursal,pago_efectivo:t.efectivo,pago_tarjeta:t.tarjeta,pago_transferencia:t.transferencia,pago_rappi:t.rappi,venta_total:total,num_ventas:state.turnoSales.length}).then(function(){
    showToast('Turno cerrado -- consolidado en INGRESOS'); state.turnoSales=[]; state.pedidos=[]; renderCaja(); renderTopbar();
  });
}

/* ============ INIT ============ */
function initApp(){
  initLogin();
  document.getElementById('btnLogout').addEventListener('click',logout);
  document.getElementById('btnClearCart').addEventListener('click',clearCart);
  document.getElementById('btnCobrar').addEventListener('click',openCheckout);
  document.getElementById('btnNota').addEventListener('click',openNota);
  document.getElementById('btnDescuento').addEventListener('click',openDescuento);
  document.getElementById('btnSeparador').addEventListener('click',openSeparador);
  document.getElementById('searchInput').addEventListener('input',function(e){ state.search=e.target.value; renderProducts(); });
  document.querySelectorAll('#scApp .nav-tab').forEach(function(t){ t.addEventListener('click',function(){ switchView(t.dataset.view); }); });
  document.querySelectorAll('#scTipoOrden .to-card').forEach(function(c){ c.addEventListener('click',function(){ selectTipoOrden(c.dataset.tipo); }); });
}
document.addEventListener('DOMContentLoaded',initApp);
</script>
