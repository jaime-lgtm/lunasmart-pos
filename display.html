<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Sueño de Luna — Pantalla de cliente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  /* Misma identidad que pos.html/theme-lunasmart.css -- tinta neutra en
     vez del café cálido viejo, Figtree en vez de Playfair Display. */
  --cafe:#16181a; --cafe-medio:#3b3f43; --terracota:#b14618;
  --terracota-claro:#e8763a; --beige:#f1f3f5; --beige-claro:#f1f3f5;
  --verde-ok:#2e7d4f; --gris:#6b7076; --linea:rgba(22,24,26,.1);
  font-family:'Figtree',system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{background:var(--beige-claro);color:var(--cafe);overflow:hidden;user-select:none;}
.hidden{display:none!important;}

/* ---- Pantalla ociosa (sin pedido activo) ---- */
#idle{position:fixed;inset:0;overflow:hidden;}
#idlePromoImg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
#idleBrand{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  background:linear-gradient(160deg,var(--cafe),var(--cafe-medio));color:var(--beige);text-align:center;padding:40px;}
#idleBrand .logo{width:110px;height:110px;border-radius:24%;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:900;color:var(--beige);background:var(--terracota);box-shadow:0 14px 40px rgba(177,70,24,.4);overflow:hidden;flex-shrink:0;}
#idleBrand .logo img{width:100%;height:100%;object-fit:cover;}
#idleBrand h1{font-family:'Figtree',sans-serif;font-size:52px;font-weight:900;letter-spacing:-.02em;color:var(--beige);}
#idleBrand .tag{font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--terracota-claro);}
#idleBrand .rule{width:64px;height:1px;background:rgba(232,214,185,.35);margin:2px 0;}
#idleBrand p{font-size:17px;opacity:.8;max-width:640px;line-height:1.6;}
#idle .suc{position:absolute;bottom:26px;right:30px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--beige);opacity:.9;z-index:2;border:1px solid rgba(232,214,185,.4);border-radius:999px;padding:8px 18px;}
#idle .brandmark{position:absolute;bottom:26px;left:30px;display:flex;align-items:center;gap:8px;font-family:'Figtree',sans-serif;font-size:13px;font-weight:800;color:var(--beige);opacity:.6;z-index:2;}
#idle .brandmark img{width:20px;height:20px;border-radius:6px;display:block;}
#idle .brandmark span{color:var(--terracota-claro);}

/* ---- Pantalla de pedido en construccion ----
   Sin clamp()/vw ni env()+calc(): esta pantalla vive en una tablet fija con
   navegador viejo (WebView de Android sin actualizar) que no soporta bien
   esas funciones -- al ser invalidas, tiran TODA la declaracion (tamaños,
   padding) y descuadran el layout de Subtotal/Total. Tamaños fijos en px,
   universalmente soportados, en vez de "responsivo" innecesario para una
   pantalla que siempre es del mismo tamaño físico. */
#live{position:fixed;inset:0;display:none;flex-direction:column;background:#fff;}
#live.show{display:flex;}
#idle.hide{display:none;}
.live-head{background:var(--cafe);color:var(--beige);padding:26px 40px;display:flex;align-items:center;justify-content:space-between;}
.live-head .t{font-size:30px;font-weight:800;}
.live-head .tipo{font-size:17px;opacity:.8;margin-top:4px;}
.cliente-banner{background:var(--terracota);color:#fff;padding:16px 40px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.cliente-banner .cb-hola{font-size:22px;font-weight:800;}
.cliente-banner .cb-puntos{font-size:17px;font-weight:700;opacity:.95;}
.live-body{flex:1;overflow-y:auto;padding:20px 40px;}
.live-empty{color:var(--gris);font-size:19px;text-align:center;padding:60px 20px;}
.li{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;padding:18px 0;border-bottom:1px solid var(--linea);}
.li .info{flex:1;}
.li .n{font-size:25px;font-weight:700;color:var(--cafe);}
.li .m{font-size:15px;color:var(--terracota);margin-top:4px;}
.li .note{font-size:14px;color:var(--gris);margin-top:2px;font-style:italic;}
.li .q{font-size:20px;font-weight:800;color:var(--gris);min-width:44px;text-align:center;flex-shrink:0;}
.li .p{font-size:25px;font-weight:800;color:var(--cafe);min-width:110px;text-align:right;flex-shrink:0;}
.live-foot{border-top:2px solid var(--linea);padding:22px 40px 28px;background:var(--beige-claro);}
.row{display:flex;justify-content:space-between;font-size:18px;color:var(--cafe-medio);padding:4px 0;}
.row span{white-space:nowrap;}
#rowDescLbl{white-space:normal;padding-right:16px;}
#rowDesc{flex-shrink:0;}
.row.total{font-size:42px;font-weight:900;color:var(--terracota);padding-top:10px;}
</style>
</head>
<body>

<div id="idle">
  <img id="idlePromoImg" class="hidden">
  <div id="idleBrand">
    <div class="logo"><img id="idleLogoImg" src="logo-badge.png"><span id="idleLogoFallback" class="hidden">LS</span></div>
    <h1>Sueño de Luna</h1>
    <div class="tag">Coffee, Bakery &amp; Roasters</div>
    <div class="rule"></div>
    <p>Café puro 100% artesanal, tostado en casa.<br>Piedras Negras, Coahuila.</p>
  </div>
  <div class="brandmark"><img src="icons/pos/favicon-192.png" alt="">luna<span>smart</span></div>
  <div class="suc" id="sucLbl"></div>
</div>

<div id="live">
  <div class="live-head">
    <div>
      <div class="t">Tu pedido</div>
      <div class="tipo" id="liveTipo"></div>
    </div>
  </div>
  <div class="cliente-banner hidden" id="clienteBanner">
    <div class="cb-hola">¡Bienvenido<span id="cbNombre"></span>!</div>
    <div class="cb-puntos hidden" id="cbPuntosWrap">🌙 <span id="cbPuntos"></span> puntos disponibles</div>
  </div>
  <div class="live-body" id="liveItems"></div>
  <div class="live-foot">
    <div class="row"><span>Subtotal</span><span id="rowSub">$0.00</span></div>
    <div class="row hidden" id="rowDescWrap"><span id="rowDescLbl">Descuento</span><span id="rowDesc">-$0.00</span></div>
    <div class="row total"><span>Total</span><span id="rowTotal">$0.00</span></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
var firebaseConfig = {
  apiKey: "AIzaSyAylUrEQGXad-DAZrTCWVrrXeq1rrLVTwM",
  authDomain: "luna-smart-pos.firebaseapp.com",
  databaseURL: "https://luna-smart-pos-default-rtdb.firebaseio.com",
  projectId: "luna-smart-pos",
  storageBucket: "luna-smart-pos.firebasestorage.app",
  messagingSenderId: "29167679041",
  appId: "1:29167679041:web:0959c2161d86552ded38c0"
};
firebase.initializeApp(firebaseConfig);
var fbDb = firebase.database();
var fbAuthReady = firebase.auth().signInAnonymously().catch(function(e){ console.error('Firebase auth', e); });

var NOMBRES = {cafeteria:'Casa de la Cultura', grano:'Venta café en grano', helfy:'Helfy Fu', barbacoa:'Barbacoa'};
var TIPO_LABEL={domicilio:'Servicio a domicilio', llevar:'Para llevar', aqui:'Comer aquí'};

function money(n){ return '$'+(Number(n)||0).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

var params = new URLSearchParams(location.search);
var suc = params.get('suc');
var _activoActual = false;

function pintar(data){
  var idle=document.getElementById('idle'), live=document.getElementById('live');
  var activo = !!(data && data.activo);
  _activoActual = activo;
  if(!activo){
    idle.classList.remove('hide'); live.classList.remove('show');
    return;
  }
  idle.classList.add('hide'); live.classList.add('show');
  var tipoTxt = data.mesa ? ('Mesa '+data.mesa) : (data.tipoOrden ? (TIPO_LABEL[data.tipoOrden]||'') : '');
  document.getElementById('liveTipo').textContent = tipoTxt;

  var banner=document.getElementById('clienteBanner');
  if(data.cliente && data.cliente.nombre){
    banner.classList.remove('hidden');
    document.getElementById('cbNombre').textContent = ', '+data.cliente.nombre;
    var pw=document.getElementById('cbPuntosWrap');
    if(data.cliente.puntos>0){ pw.classList.remove('hidden'); document.getElementById('cbPuntos').textContent = data.cliente.puntos; }
    else { pw.classList.add('hidden'); }
  } else {
    banner.classList.add('hidden');
  }

  var items=data.items||[];
  if(!items.length){
    document.getElementById('liveItems').innerHTML = '<div class="live-empty">Armando tu pedido...</div>';
  } else {
    document.getElementById('liveItems').innerHTML = items.map(function(it){
      return '<div class="li"><div class="info"><div class="n">'+esc(it.name)+'</div>'+
        (it.mods?'<div class="m">'+esc(it.mods)+'</div>':'')+
        (it.note?'<div class="note">'+esc(it.note)+'</div>':'')+
        '</div><div class="q">x'+(it.qty||1)+'</div><div class="p">'+money((it.price||0)*(it.qty||1))+'</div></div>';
    }).join('');
  }
  document.getElementById('rowSub').textContent = money(data.subtotal);
  var dw=document.getElementById('rowDescWrap');
  if(data.descuento>0){
    dw.classList.remove('hidden');
    var dTxt='Descuento';
    if(data.descuentoNombre){ dTxt+=' ('+data.descuentoNombre+(data.descuentoPct>0?' '+data.descuentoPct+'%':'')+')'; }
    else if(data.descuentoPct>0){ dTxt+=' ('+data.descuentoPct+'%)'; }
    document.getElementById('rowDescLbl').textContent=dTxt;
    document.getElementById('rowDesc').textContent='-'+money(data.descuento);
  }
  else { dw.classList.add('hidden'); }
  document.getElementById('rowTotal').textContent = money(data.total);
}

/* ---- Configuracion de pantalla (logo + promos en espera), editable desde
   lunasmart.suenodeluna.com.mx -- se refleja en vivo via .on('value'), sin
   necesidad de reabrir esta app ni reinstalar nada. ---- */
// _slides mezcla la marca (logo) y las promociones en UN solo carrusel --
// null representa "muestra la marca", cualquier otra cosa es una URL de
// promocion. Asi el logo tambien se turna en el ciclo en vez de quedar
// tapado para siempre en cuanto hay alguna promocion cargada.
var _slides = [null];
var _slideIx = 0;
var _slideTimer = null;

function pintarConfig(cfg){
  cfg = cfg || {};
  var logoImg=document.getElementById('idleLogoImg');
  logoImg.src = cfg.logoUrl || 'logo-badge.png';

  var promos = (cfg.promoImages||[]).filter(Boolean);
  var seg = cfg.duracionSegundos>0 ? cfg.duracionSegundos : 30;
  _slides = [null].concat(promos);
  _slideIx = 0;
  if(_slideTimer){ clearInterval(_slideTimer); _slideTimer=null; }
  _mostrarSlideActual();
  if(_slides.length>1){
    _slideTimer = setInterval(function(){
      _slideIx = (_slideIx+1) % _slides.length;
      _mostrarSlideActual();
    }, seg*1000);
  }
}
function _mostrarSlideActual(){
  var promoEl=document.getElementById('idlePromoImg'), brandEl=document.getElementById('idleBrand');
  var slide = _slides[_slideIx];
  if(slide){
    promoEl.src = slide;
    promoEl.classList.remove('hidden'); brandEl.classList.add('hidden');
  } else {
    promoEl.classList.add('hidden'); brandEl.classList.remove('hidden');
  }
}

if(!suc){
  document.getElementById('idleBrand').innerHTML = '<div class="logo"><img src="logo-badge.png"></div><h1>Falta configurar</h1><p>Abre esta pantalla desde el POS: Configuración → Doble pantalla → Abrir pantalla de cliente.</p>';
} else {
  document.getElementById('sucLbl').textContent = NOMBRES[suc] || suc;
  fbAuthReady.then(function(){
    fbDb.ref('cajaLive/'+suc).on('value', function(snap){ pintar(snap.val()); });
    fbDb.ref('displayConfig/'+suc).on('value', function(snap){ pintarConfig(snap.val()); });
  });
}
</script>
</body>
</html>
